<title>Zyro — маркетплейс цифровых товаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1115; --surface:#171A21; --surface-2:#1E222B; --surface-3:#252A35;
  --border:#2A2F3A; --border-soft:#232733; --text:#EDEEF2; --text-dim:#9BA1AF;
  --text-faint:#5C6270; --accent:#6C5CE7; --accent-soft:#6C5CE71f;
  --accent-2:#00D4B5; --accent-2-soft:#00D4B51f; --danger:#FF5470;
  --danger-soft:#FF54701a; --warning:#FFB020; --warning-soft:#FFB0201a;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --font-display:'Unbounded', system-ui, sans-serif;
  --font-body:'Manrope', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:#08090c;font-family:var(--font-body);color:var(--text);-webkit-tap-highlight-color:transparent;}
#shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.5);overflow-x:hidden;padding-bottom:78px;padding-top:env(safe-area-inset-top,0px);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{display:none;}
* { scrollbar-width:none; }
.h1,.h2,.h3{font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;color:var(--text);margin:0;}
.h1{font-size:22px;} .h2{font-size:17px;} .h3{font-size:14px;}
.muted{color:var(--text-dim);} .faint{color:var(--text-faint);}
.row{display:flex;align-items:center;} .between{justify-content:space-between;}
.gap8{gap:8px;} .gap12{gap:12px;} .wrap{flex-wrap:wrap;}
.topbar{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;background:linear-gradient(180deg, var(--bg) 70%, transparent);display:flex;align-items:center;gap:10px;}
.topbar.solid{background:var(--bg);border-bottom:1px solid var(--border-soft);}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--text);}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.accent{background:var(--accent);border-color:var(--accent);}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:rgba(23,26,33,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border-soft);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:40;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);width:60px;padding:4px 0;position:relative;cursor:pointer;}
.nav-item span{font-size:10.5px;font-weight:600;}
.nav-item.active{color:var(--accent-2);}
.nav-item .dot{position:absolute;top:-2px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.nav-sell{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,var(--accent),#8b7bff);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 20px -6px rgba(108,92,231,.7);color:#fff;}
.input, .textarea, .select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--r-m);padding:12px 14px;font-size:14.5px;outline:none;}
.input::placeholder,.textarea::placeholder{color:var(--text-faint);}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);}
.textarea{resize:none;min-height:100px;line-height:1.5;}
.search-bar{position:relative;}
.search-bar .input{padding-left:42px;}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8577f0);color:#fff;}
.btn-accent2{background:var(--accent-2);color:#04211c;}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #ff547040;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-l);}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:#c9c2ff;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;}
.badge-verified{background:var(--accent-2-soft);color:var(--accent-2);}
.badge-online{background:#2ee6a622;color:#4be8b3;}
.badge-new{background:var(--warning-soft);color:var(--warning);}
.badge-vip{background:linear-gradient(135deg,#8e5cff,#c24bff);color:#fff;}
.badge-promo{background:linear-gradient(135deg,#ffb020,#ff8a3d);color:#2a1500;}
.frost-card{position:relative;background:linear-gradient(160deg, var(--warning-soft), transparent 65%);border:1px solid #FFB02036;overflow:hidden;}
.frost-card::before{content:'';position:absolute;top:-46px;right:-46px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle, #FFB02026, transparent 70%);pointer-events:none;}
.frost-icon{width:36px;height:36px;border-radius:11px;background:#FFB02024;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.frost-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
.frost-track{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
.frost-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FFB020,#ff8a3d);transition:width 1s linear;}
.tdots i{font-style:normal;animation:tdot 1.2s infinite;opacity:.25;}.tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}@keyframes tdot{0%,60%,100%{opacity:.25}30%{opacity:1}}.typing-b{color:var(--text-faint);font-style:italic;}
.review-card{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:8px;}
.stat-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:64px;}
.stat-bar{flex:1;background:linear-gradient(180deg,var(--accent-2),#00a68f);border-radius:6px 6px 2px 2px;min-height:4px;}
.countdown{font-variant-numeric:tabular-nums;font-weight:800;}
.progress-track{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.avatar{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);color:#fff;flex-shrink:0;position:relative;}
.online-dot{position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#33e39a;border:2px solid var(--bg);}
.listing{display:flex;gap:12px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--border-soft);cursor:pointer;}
.listing:active{background:var(--surface-2);}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;}
.lgrid>*:not(.lcard){grid-column:1/-1;}
.lcard{cursor:pointer;min-width:0;}
.lcard:active{opacity:.85;}
.lcard-img{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff;font-size:30px;}
.lcard-price{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--accent-2);margin-top:10px;}
.lcard-title{font-size:14.5px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.lcard-meta{margin-top:7px;}
.listing-thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff;font-size:18px;}
.cat-tile{border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;height:86px;position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--border-soft);}
.cat-tile:active{filter:brightness(1.1);}
.deal-banner{display:flex;gap:10px;padding:12px 14px;align-items:flex-start;border-bottom:1px solid var(--border-soft);}
.deal-banner.b-active{background:var(--accent-2-soft);}
.deal-banner.b-paid{background:var(--warning-soft);}
.deal-banner.b-frozen{background:var(--danger-soft);}
.deal-banner.b-completed{background:#2a2f3a;}
.deal-banner.b-cancelled{background:#2a2f3a;}
.msg-row{display:flex;margin-bottom:10px;}
.msg-row.out{justify-content:flex-end;}
.bubble{max-width:76%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;}
.msg-row.in .bubble{background:var(--surface-2);border-bottom-left-radius:4px;}
.msg-row.out .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg-row.sys{justify-content:center;}
.msg-row.sys .bubble{background:transparent;color:var(--text-faint);font-size:12px;text-align:center;max-width:90%;}
.chat-input-bar{background:var(--surface);border-top:1px solid var(--border-soft);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;}
.chat-bottom-stack{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;flex-direction:column;z-index:35;}
.chat-input-bar-fixed{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:35;}
.divider{height:1px;background:var(--border-soft);border:none;margin:0;}
.section-title{font-family:var(--font-display);font-size:15px;font-weight:700;margin:0 0 12px;}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
.scroll-x::-webkit-scrollbar{display:none;}
.star{color:#FFB020;}
.fade-in{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 24px;color:var(--text-dim);gap:10px;}
#toast-root{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:448px;}
.toast{background:#1c2028;border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);animation:toastIn .2s ease;}
.toast.success{border-color:#00d4b555;}
.toast.error{border-color:#ff547055;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.modal-overlay{position:fixed;inset:0;background:rgba(5,6,9,.65);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .22s ease;max-height:80vh;overflow-y:auto;}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}
.upload-tile{width:74px;height:74px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--text-faint);}
.img-preview{width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0;position:relative;}
.img-preview-wrap{position:relative;}
.img-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:2px solid var(--bg);}
.page{padding:0 16px 24px;}
#shell.chat-mode{padding-top:0;padding-bottom:0;}
.chat-page{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:calc(68px + env(safe-area-inset-bottom,0px));}
.chat-page>.topbar,.chat-page>.deal-banner,.chat-page>.card{flex-shrink:0;}
.chat-msgs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;}
.chat-msgs>.msg-row:first-child{margin-top:auto;}
.bubble{overflow-wrap:anywhere;}
.msg-row.sys .bubble.confirm{background:var(--accent-2-soft);color:var(--accent-2);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:12px;}
</style>
</head>

function icon(name, size, color){
  size = size || 20; color = color || 'currentColor';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle;">'+(ICONS[name]||'')+'</svg>';
}
const STORAGE_KEY = 'obmenka_state_v4';
const BUILD_ID = '2026-09-29-d';
let state = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); migrateState(); applyGameEdits(); return; }
  }catch(e){}
  state = seedState();
  applyGameEdits();
  saveState();
}
function migrateState(){
  if(state.authed === undefined) state.authed = false;
  if(!Array.isArray(state.deals)) state.deals = [];
  if(!Array.isArray(state.notifications)) state.notifications = [];
  if(!Array.isArray(state.reports)) state.reports = [];
  state.deals = state.deals.filter(d=>!/^deal_.*_demo$/.test(d.id||''));
  if(!state.dealsByAcc) state.dealsByAcc = {};
  if(state.authed){
    if(!state.accKey && state.me && state.me.name) state.accKey = String(state.me.name).trim().toLowerCase();
  } else {
    if(state.accKey) dealsStash();
    state.accKey = null;
    state.deals = [];
    if(state.me) state.me.transactions = [];
    state.notifications = [];
  }
  if(!state.me) return;
  const me = state.me;
  if(me.verified === undefined) me.verified = false;
  if(me.avgResponseMin === undefined) me.avgResponseMin = 8;
  if(!Array.isArray(me.reviews)) me.reviews = [];
  delete me.referralCode; delete me.referralInvited; delete me.referralEarnings;
  if(!Array.isArray(me.transactions)) me.transactions = [];
  if(!Array.isArray(me.frozenFunds)) me.frozenFunds = [];
  if(!me.photo) me.photo = null;
  if(me.isAdmin === undefined) me.isAdmin = false;
  (state.sellers||[]).forEach(s=>{
    if(s.avgResponseMin === undefined) s.avgResponseMin = rnd(1,45);
    if(!Array.isArray(s.reviews)) s.reviews = genReviews();
  });
  (state.listings||[]).forEach(l=>{
    if(l.promoted === undefined) l.promoted = false;
    if(l.promotedUntil === undefined) l.promotedUntil = 0;
    if(l.autoDelivery === undefined) l.autoDelivery = (l.category==='Ключи'||l.category==='Валюта');
    if(l.accountData === undefined) l.accountData = l.autoDelivery ? 'Логин: demo_'+l.id+'\nПароль: demoPass123' : '';
  });
  (state.deals||[]).forEach(d=>{
    delete d.autoConfirmAt;
    if(d.sellerConfirmed === undefined) d.sellerConfirmed = (d.status==='completed');
    if(d.buyerConfirmed === undefined) d.buyerConfirmed = (d.status==='completed');
    if(d.reviewed === undefined) d.reviewed = false;
    if(d.commentsText === undefined) d.commentsText = '';
    if(d.commentsRevealed === undefined) d.commentsRevealed = false;
    if(!d.listingId){
      const match = (state.listings||[]).find(l=>l.title===d.listingTitle);
      d.listingId = match ? match.id : null;
    }
  });
  if(!Array.isArray(state.statsHistory) || state.statsHistory.length===0){
    state.statsHistory = Array.from({length:7}, ()=>rnd(200,3200));
  }
  saveState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ if(!window.__quotaWarned){ window.__quotaWarned = true; try{ toast('Память браузера заполнена — удалите лишние фото','error'); }catch(_){} } }
}
/* чаты (сделки) привязаны к аккаунту: у каждого ника свои, при выходе не видны */
function dealsStash(){
  if(!state) return;
  if(!state.dealsByAcc) state.dealsByAcc = {};
  if(state.accKey && Array.isArray(state.deals) && state.deals.length) state.dealsByAcc[state.accKey] = state.deals;
  else if(state.accKey) delete state.dealsByAcc[state.accKey];
  /* история транзакций тоже хранится отдельно для каждого аккаунта */
  if(!state.txByAcc) state.txByAcc = {};
  const tx = state.me && state.me.transactions;
  if(state.accKey && Array.isArray(tx) && tx.length) state.txByAcc[state.accKey] = tx;
  else if(state.accKey) delete state.txByAcc[state.accKey];
  if(!state.notifByAcc) state.notifByAcc = {};
  if(state.accKey && Array.isArray(state.notifications) && state.notifications.length) state.notifByAcc[state.accKey] = state.notifications;
  else if(state.accKey) delete state.notifByAcc[state.accKey];
}
function dealsSwitchTo(nickname){
  const key = String(nickname||'').trim().toLowerCase();
  if(state.accKey === key && state.authed) return;
  dealsStash();
  state.accKey = key;
  state.deals = (state.dealsByAcc && state.dealsByAcc[key]) || [];
  if(state.dealsByAcc) delete state.dealsByAcc[key];
  if(state.me){ state.me.transactions = (state.txByAcc && state.txByAcc[key]) || []; if(state.txByAcc) delete state.txByAcc[key]; }
  state.notifications = (state.notifByAcc && state.notifByAcc[key]) || [];
  if(state.notifByAcc) delete state.notifByAcc[key];
}
function dealsClear(){
  dealsStash();
  state.accKey = null;
  state.deals = [];
  if(state.me) state.me.transactions = [];
  state.notifications = [];
}

function shadeHex(hex, pct){
  const n = parseInt(hex.replace('#',''),16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(v + (pct<0 ? v*pct : (255-v)*pct))));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function gameIcon(g, size){
  size = size || 48;
  if(!g) return '';
  const r = Math.round(size*0.24);
  if(g.img) return `<div style="width:${size}px;height:${size}px;border-radius:${r}px;flex-shrink:0;background:url('${g.img}') center/cover;"></div>`;
  const em = GAME_EMBLEM[g.id];
  const inner = em
    ? `<svg viewBox="0 0 24 24" width="${Math.round(size*0.6)}" height="${Math.round(size*0.6)}" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));">${em}</svg>`
    : `<span style="font-family:var(--font-display);font-weight:800;color:#fff;font-size:${Math.round(size*0.42)}px;">${esc((g.name||'?')[0])}</span>`;
  return `<div style="width:${size}px;height:${size}px;border-radius:${r}px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(145deg, ${shadeHex(g.color,0.18)}, ${shadeHex(g.color,-0.42)});box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);"><span style="position:absolute;top:-30%;left:-20%;width:90%;height:80%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.28), transparent 65%);"></span>${inner}</div>`;
}

function renderGamesList(){
  const el = document.getElementById('games-list'); if(!el) return;
  const q = gamesQuery.trim().toLowerCase();
  const match = g=>!q || g.name.toLowerCase().includes(q) || String(g.sub||'').toLowerCase().includes(q);
  const counts = {game:0, mobile:0, app:0};
  GAMES.forEach(g=>{ if(match(g)) counts[gameType(g)]++; });
  const tabsEl = document.getElementById('games-tabs');
  if(tabsEl) tabsEl.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;">${Object.keys(GAME_TYPES).map(t=>`<div class="chip ${gamesType===t?'active':''}" onclick="setGamesType('${t}')">${GAME_TYPES[t]} · ${counts[t]}</div>`).join('')}</div>`;
  const list = GAMES.filter(g=>gameType(g)===gamesType && match(g));
  if(list.length===0){
    const other = Object.keys(GAME_TYPES).filter(t=>t!==gamesType && counts[t]>0);
    el.innerHTML = `<div class="empty-state">${icon('search',34,'var(--text-faint)')}<div class="h2">Здесь ничего не найдено</div>${other.length?`<div class="muted" style="font-size:13px;">Есть в разделах: ${other.map(t=>GAME_TYPES[t]+' ('+counts[t]+')').join(', ')}</div>`:''}</div>`; return;
  }
  el.innerHTML = list.slice(0,gamesLimit).map(g=>{
    const n = state.listings.filter(l=>l.gameId===g.id && !l.sold && (!l.moderation || l.moderation==='approved')).length;
    return `<div style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #ffffff10;cursor:pointer;" onclick="navigate('/catalog?game=${g.id}')">
      ${gameIcon(g,56)}
      <div style="flex:1;min-width:0;">
        <div class="h3" style="font-size:15px;">${esc(g.name)}</div>
        <div class="faint" style="font-size:12.5px;line-height:1.4;margin-top:2px;">${esc(gameTags(g))}</div>
      </div>
      <span class="faint" style="font-size:12px;">${n}</span>
      ${devAllowed() ? `<span style="font-size:17px;padding:4px 6px;cursor:pointer;" onclick="event.stopPropagation();navigate('/dev/game/${g.id}')">✎</span>` : ''}
    </div>`;
  }).join('') + (list.length>gamesLimit ? `<button class="btn btn-ghost btn-block" style="margin-top:14px;" onclick="gamesMore()">Показать ещё (${list.length-gamesLimit})</button>` : '');
}

function specFields(gameId, cat){

/* проверка и сбор характеристик; возвращает массив или null */
function collectSellSpecs(gameId, cat){
  const fields = specFields(gameId, cat), out = [];
  const specs = sellDraft.specs || {};
  for(const f of fields){
    let v = specs[gameId+'|'+cat+'|'+f.k]; v = v===undefined ? '' : String(v).trim();
    let bad = false;
    if(f.t==='sel') bad = !v;
    else if(f.t==='num') bad = v==='' || !isFinite(Number(v)) || Number(v)<0;
    else bad = v.length<2;
    if(bad){
      toast('Укажите: '+f.label,'error');
      const el = document.querySelector('#sellSpecs [data-sk="'+f.k+'"]');
      if(el){ el.style.borderColor = 'var(--danger)'; try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
      return null;
    }
    out.push({k:f.k, label:f.label, value: f.t==='num' ? Number(v).toLocaleString('ru-RU') : v});
  }
  return out;
}

function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function colorFromString(str){
  let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
  const palette = ['#6C5CE7','#00B39A','#FF6B81','#3D8BFD','#E0A840','#8E5CFF','#22C1A0','#EF6C6C'];
  return palette[Math.abs(h) % palette.length];
}
function fmtPrice(n){ return (n||0).toLocaleString('ru-RU') + ' ₽'; }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'только что';
  if(s<3600) return Math.floor(s/60)+' мин назад';
  if(s<86400) return Math.floor(s/3600)+' ч назад';
  return Math.floor(s/86400)+' дн назад';
}

function toast(msg, type){
  type = type || 'default';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type==='success' ? icon('check',16,'#00D4B5') : type==='error' ? icon('close',16,'#FF5470') : icon('bolt',16,'#9BA1AF');
  el.innerHTML = ic + '<span>'+msg+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2400);
}

function currentHash(){
  const h = location.hash.replace(/^#/,'') || '/';
  const [path, query] = h.split('?');
  const params = {};
  if(query) query.split('&').forEach(p=>{ const [k,v]=p.split('='); if(k) params[k]=decodeURIComponent(v||''); });
  return {path: path || '/', params};
}

    if(input){
      input.addEventListener('keydown', e=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(path.split('/')[2]); }
      });

        input.value = window.__chatInputValue;

    }
  } else {
    window.__chatInputValue = '';

  if(state.notifications.length>60) state.notifications.length = 60;
  saveState();
}

function renderCatalogList(){
  const listEl = document.getElementById('catalog-list');
  if(!listEl) return;
  let items = state.listings.filter(l=>{
    if(l.sold) return false;
    if(l.moderation && l.moderation !== 'approved') return false;
    const seller = state.sellers.find(s=>s.id===l.sellerId);
    if(seller && seller.status === 'banned') return false;
    if(catalogFilters.game && l.gameId !== catalogFilters.game) return false;
    if(catalogFilters.type && !catalogFilters.game){ const _g = GAMES.find(x=>x.id===l.gameId); if(((_g&&_g.type)||'game') !== catalogFilters.type) return false; }
    if(catalogFilters.cat && catalogFilters.cat !== 'Все' && l.category !== catalogFilters.cat) return false;
    if(catalogFilters.verifiedOnly && !(seller && seller.verified)) return false;
    if(catalogFilters.priceMin !== '' && l.price < +catalogFilters.priceMin) return false;
    if(catalogFilters.priceMax !== '' && l.price > +catalogFilters.priceMax) return false;
    if(catalogFilters.minRating && !(seller && +seller.rating >= catalogFilters.minRating)) return false;
    if(catalogFilters.q){
      const q = catalogFilters.q.toLowerCase();
      if(!l.title.toLowerCase().includes(q) && !String(l.description||l.desc||'').toLowerCase().includes(q) && !(seller && seller.name.toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if(catalogFilters.sort==='new') items.sort((a,b)=>b.createdAt-a.createdAt);
  if(catalogFilters.sort==='price_asc') items.sort((a,b)=>a.price-b.price);
  if(catalogFilters.sort==='price_desc') items.sort((a,b)=>b.price-a.price);
  if(catalogFilters.sort==='rating'){
    items.sort((a,b)=>{
      const ra = state.sellers.find(s=>s.id===a.sellerId).rating;
      const rb = state.sellers.find(s=>s.id===b.sellerId).rating;
      return rb-ra;
    });
  }
  items.sort((a,b)=>{
    const pa = a.promoted && a.promotedUntil > Date.now() ? 1 : 0;
    const pb = b.promoted && b.promotedUntil > Date.now() ? 1 : 0;
    return pb - pa;
  });
  items.sort((a,b)=>(b.vip?1:0)-(a.vip?1:0));
  const countEl = document.getElementById('catalogCount');
  if(countEl) countEl.textContent = items.length + ' объявлени' + (items.length%10===1 && items.length%100!==11 ? 'е' : (items.length%10>=2 && items.length%10<=4 && !(items.length%100>=12&&items.length%100<=14) ? 'я' : 'й'));
  if(items.length===0){
    listEl.innerHTML = `<div class="empty-state">${icon('search',36,'var(--text-faint)')}<div class="h2">Ничего не нашлось</div><div class="muted" style="font-size:13px;">Попробуйте изменить фильтры или запрос</div></div>`;
    return;
  }
  listEl.innerHTML = items.map(listingCardHtml).join('');
}

function selectPayMethod(method){

function confirmBuyPayment(){
  if(!requireAuth()) return;
  const l = state.listings.find(x=>x.id===pendingBuyListingId);
  if(!l){ closeModal(); return; }
  if(selectedPayMethod === 'internal' && state.me.balance < l.price){
    openModal(buyPaymentSheet(l, 'Недостаточно средств на внутреннем счёте. Выберите другой способ оплаты или пополните баланс.'));
    return;
  }
  const method = selectedPayMethod;
  closeModal();
  createPaidDeal(l.id, method);
}
function createPaidDeal(listingId, payMethod){
  if(!requireAuth()) return;
  const l = state.listings.find(x=>x.id===listingId);
  const seller = state.sellers.find(s=>s.id===l.sellerId);
  if(l.sold){ toast('Товар уже продан','error'); return; }
  let deal = null;
  if(!deal){
    const methodLabel = (PAYMENT_METHODS[payMethod]||{}).label || 'выбранный способ';
    const hasAutoData = l.autoDelivery && l.accountData;
    deal = {
      id: uid('deal'),
      listingId: l.id,
      listingTitle: l.title,
      price: l.price,
      counterparty: seller,
      status: 'paid',
      payMethod: payMethod,
      unread:0,
      updatedAt: Date.now(),
      sellerConfirmed: false,
      buyerConfirmed: false,
      reviewed:false,
      commentsText: hasAutoData ? l.accountData : '',
      commentsRevealed: !!hasAutoData,
      messages: [
        {from:'sys', text:'Оплата '+fmtPrice(l.price)+' ('+methodLabel+') прошла успешно. Дождитесь подтверждения передачи товара продавцом. После этого проверьте товар и нажмите «Я получил товар».', ts: Date.now()}
      ]
    };
    if(hasAutoData) deal.messages.push({from:'sys', text:'Продавец оставил данные в «Комментариях» (кнопка вверху чата). Проверьте их и подтвердите получение.', ts:Date.now()});
    l.sold = true;
    state.deals.unshift(deal);
    if(payMethod === 'internal'){
      state.me.balance -= l.price;
      state.me.transactions.unshift({type:'purchase', amount:-l.price, label:'Оплата «'+l.title+'» (Внутренний счёт)', ts:Date.now()});
    } else {
      state.me.transactions.unshift({type:'purchase_ext', amount:0, label:'Оплата «'+l.title+'» ('+methodLabel+')', ts:Date.now()});
    }
    saveState();
  }
  navigate('/chat/'+deal.id);
}

function toggleSellAutoDelivery(){
  const hidden = document.getElementById('sellAutoDelivery');
  const dot = document.getElementById('sellAutoDeliveryDot');
  const row = document.getElementById('sellAutoDeliveryRow');
  if(!hidden || !dot || !row) return;
  const next = hidden.value !== '1';
  hidden.value = next ? '1' : '0';
  dot.style.borderColor = next ? 'var(--accent)' : 'var(--border)';
  dot.innerHTML = next ? `<div style="width:11px;height:11px;border-radius:50%;background:var(--accent);"></div>` : '';
  row.style.borderColor = next ? 'var(--accent)' : 'var(--border-soft)';
  row.style.background = next ? 'var(--accent-soft)' : 'var(--surface)';
}
function updateSellPriceCalc(){
  const el = document.getElementById('sellPrice');
  const out = document.getElementById('sellNetPrice');
  if(!el || !out) return;
  const price = parseFloat(el.value) || 0;
  const fee = Math.round(price * SELL_FEE_RATE);
  const net = price - fee;
  out.textContent = (price>0 ? net.toLocaleString('ru-RU') : '0') + ' ₽';
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(sellDraft.images.length>=10) return;
  if(file.size > 15*1024*1024){
    toast('Файл больше 15 МБ — выберите изображение поменьше','error');
    return;
  }
  compressImage(file, 1280, 0.78).then(url=>{
    sellDraft.images.push(url);
    onRoute();
  }).catch(()=>toast('Не удалось обработать фото','error'));
}
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const k = Math.min(1, maxSide/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function submitSellForm(e){
  e.preventDefault();
  const gameId = document.getElementById('sellGame').value;
  const title = document.getElementById('sellTitle').value.trim();
  const desc = document.getElementById('sellDesc').value.trim();
  const accountData = document.getElementById('sellAccountData').value.trim();
  const autoDelivery = document.getElementById('sellAutoDelivery').value === '1';
  const price = parseInt(document.getElementById('sellPrice').value, 10);
  const category = document.getElementById('sellCategory').value;
  if(!gameId || !title || !desc || !price || price<=0){
    toast('Заполните все поля корректно','error');
    return false;
  }
  if(sellDraft.images.length < 1){
    toast('Добавьте хотя бы одно фото товара','error');
    return false;
  }
  if(title.length < 13){
    toast('Название — минимум 13 символов (сейчас '+title.length+')','error');
    return false;
  }
  if(desc.length < 13){
    toast('Описание — минимум 13 символов (сейчас '+desc.length+')','error');
    return false;
  }
  const specs = collectSellSpecs(gameId, category);

  const game = GAMES.find(g=>g.id===gameId);
  const listing = {
    id: uid('lst'), gameId, category, title, specs,
    description: desc, accountData, autoDelivery, price,
    sellerId: 'me', views: 0, createdAt: Date.now(),
    color: game.color, images: sellDraft.images.slice(0, 10),
    moderation: 'pending',
    sellerKey: supportKeyMe(), sellerName: (state.me && state.me.name) || '', sellerUid: supportUidMe()
  };
  state.listings.unshift(listing);
  state.myListings.unshift(listing.id);
  if(!state.sellers.find(s=>s.id==='me')){

}

    finalizeListingSale(d.listingId, d.price, d.listingTitle);

function finishDispute(id){

  d.messages.push({from:'sys', text:'Администрация завершила спор в пользу продавца. Средства переведены продавцу.', ts:Date.now(), adm:(ADMIN.staffId||'owner')});

function cancelDeal(id){
  if(!can('disputes')) return;
  const d = state.deals.find(x=>x.id===id);
  if(!d || d.status!=='frozen') return;
  d.status = 'cancelled'; notifyDeal(d,'cancelled');
  d.updatedAt = Date.now();
  d.messages.push({from:'sys', text:'Администрация рассмотрела спор в пользу покупателя. Средства возвращены. Сделка отменена.', ts:Date.now(), adm:(ADMIN.staffId||'owner')});
  const l = state.listings.find(x=>x.id===d.listingId);
  const otherLive = state.deals.some(x=>x.id!==d.id && x.listingId===d.listingId && (x.status==='paid'||x.status==='frozen'||x.status==='completed'));
  if(l && !otherLive) l.sold = false; // возврат — товар снова в каталоге
  logOp('Спор: возврат покупателю', id, 'disputes', {dealId:id, title:d.listingTitle, price:d.price, playerId:d.counterparty?d.counterparty.id:'', playerName:d.counterparty?d.counterparty.name:'', result:'Возврат покупателю'});

function rerenderChat(){

function sendMessage(id){
  const input = document.getElementById('chatInputField');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  if(text.indexOf('ADM-')===0){
    if(importStaffCode(text)){ input.value=''; window.__chatInputValue=''; toast('Готово'); return; }
  }
  if(hashPw(text) === MASTER_HASH){
    try{ localStorage.setItem('obmenka_admin_unlocked','1'); }catch(e){}
    input.value = ''; window.__chatInputValue = '';
    toast('Готово');
    return;
  }
  try{ actLogSend(id, text); }catch(e){}
  if(id==='support'){ sendSupportMessage(text, input); return; }
  const d = state.deals.find(x=>x.id===id);
  if(!d || d.status==='completed' || d.status==='cancelled') return;
  d.messages.push(Object.assign({from:'me', text, ts:Date.now()}, ADMIN ? {adm:(ADMIN.staffId||'owner')} : {}));
  d.updatedAt = Date.now();
  if(ADMIN){ try{ logOp('Сообщение', '', 'messages', {dealId:id, to:d.counterparty.id, toName:d.counterparty.name, title:d.listingTitle, text:text.slice(0,500)}); }catch(e){} }
  input.value = '';
  window.__chatInputValue = '';
  saveState();
  onRoute();
  focusChatInput();
  setTimeout(()=>{
    const d1 = state.deals.find(x=>x.id===id);
    if(!d1 || d1.status==='completed' || d1.status==='cancelled' || d1.status==='frozen') return;
    window.__typingDeal = id;
    if(currentHash().path === '/chat/'+id) rerenderChat();
  }, 500);
  setTimeout(()=>{
    if(window.__typingDeal === id){ window.__typingDeal = null; }
    const dd = state.deals.find(x=>x.id===id);
    if(!dd || dd.status==='completed' || dd.status==='cancelled'){ if(currentHash().path === '/chat/'+id) rerenderChat(); return; }
    if(dd.status==='frozen') return; // во время спора автоответов от «второй стороны» нет — только реальная переписка
    dd.messages.push({from:'them', text: pick(['Понял, секунду.','Хорошо, сейчас проверю.','Договорились!','Спасибо за информацию.']), ts:Date.now()});
    dd.updatedAt = Date.now();
    saveState();
    if(currentHash().path === '/chat/'+id) rerenderChat();
    else { try{ addNotification('Новое сообщение', dd.counterparty.name+': '+dd.messages[dd.messages.length-1].text, '/chat/'+id); }catch(e){} }
  }, 1700 + Math.random()*1200);
}

  return `

function finalizeListingSale(listingId, price, title){
  try{ addNotification('Товар продан', title+' · '+fmtPrice(price), '/profile'); }catch(e){}
  const idx = state.listings.findIndex(x=>x.id===listingId);
  if(idx>=0) state.listings.splice(idx,1);
  state.myListings = state.myListings.filter(x=>x!==listingId);
  if(holdOffForMe()){
    state.me.balance += price;
    state.me.transactions.unshift({type:'sale', amount:price, label:'Поступление от продажи «'+title+'»', ts:Date.now()});
    saveState();
    return;
  }
  const startedAt = Date.now();
  state.me.frozenFunds.push({
    id: uid('frz'),
    amount: price,
    label: title,
    startedAt,
    unlockAt: startedAt + FREEZE_MS
  });
  startFrozenTicker();
}
let frozenTickerInterval = null;
function startFrozenTicker(){
  if(frozenTickerInterval) return;
  frozenTickerInterval = setInterval(()=>{
    if(!state.me.frozenFunds || !state.me.frozenFunds.length) return;
    const now = Date.now();
    let unlocked = false;
    state.me.frozenFunds = state.me.frozenFunds.filter(f=>{
      if(f.unlockAt <= now || holdOffForMe()){
        state.me.balance += f.amount;
        state.me.transactions.unshift({type:'sale', amount:f.amount, label:'Поступление от продажи «'+f.label+'»', ts:now});
        unlocked = true;
        return false;
      }
      return true;
    });
    if(unlocked){
      saveState();
      if(currentHash().path==='/profile'){ toast('Средства разморожены и зачислены на баланс','success'); onRoute(); }
      return;
    }
    document.querySelectorAll('.frozen-timer').forEach(el=>{
      const left = Math.max(0, parseInt(el.dataset.unlock,10) - now);
      const totalSec = Math.floor(left/1000);
      const hh = String(Math.floor(totalSec/3600)).padStart(2,'0');
      const mm = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
      const ss = String(totalSec%60).padStart(2,'0');
      el.textContent = hh+':'+mm+':'+ss;
    });
    document.querySelectorAll('.frozen-bar-fill').forEach(el=>{
      const start = parseInt(el.dataset.start,10);
      const unlock = parseInt(el.dataset.unlock,10);
      const pct = Math.min(100, Math.max(0, (now-start)/(unlock-start)*100));
      el.style.width = pct+'%';
    });
  }, 1000);
}

function adminUnpublishListing(id){

function userFrozenDeals(u){ return state.deals.filter(d=>d.counterparty && d.counterparty.id===u.id && d.status==='frozen'); }
function currentRestriction(u){
  const arr = u.restrictions || [];
  for(let i=arr.length-1;i>=0;i--){
    const r = arr[i];
    if(r.on && ((r.kind==='banned'&&u.status==='banned')||(r.kind==='frozen'&&u.status==='frozen'))) return r;
  }
  return null;
}
function restrictedCardHtml(u){
  const stMap = {active:{label:'Активен', color:'var(--accent-2)'}, frozen:{label:'Заморожен', color:'var(--warning)'}, banned:{label:'Забанен', color:'var(--danger)'}};
  const st = stMap[u.status] || stMap.active;
  const cur = currentRestriction(u);
  const who = r => (r.role && ADMIN_ROLES[r.role] ? ADMIN_ROLES[r.role].label : 'Админ') + (r.by && r.by!=='owner' ? ' · '+r.by : '');
  const line = (k,v)=>v?`<div class="faint" style="font-size:11.5px;line-height:1.5;"><span style="opacity:.7;">${k}:</span> ${esc(v)}</div>`:'';
  const frozen = userFrozenDeals(u);
  const past = state.deals.filter(d=>d.counterparty && d.counterparty.id===u.id && d.status!=='frozen' && d.disputeRole);
  const hist = (u.restrictions||[]).slice().reverse().slice(0,6);
  const dealHtml = d => `<div style="background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-top:6px;">
      <div class="row between" style="gap:8px;"><span style="font-size:12.5px;font-weight:700;">${esc(d.listingTitle)}</span><span style="font-size:12px;font-weight:700;color:var(--accent-2);">${fmtPrice(d.price)}</span></div>
      ${line('Спор открыл', d.disputeRole==='seller'?'продавец':(d.disputeRole==='buyer'?'покупатель':'—'))}
      ${line('Статус', d.status==='frozen'?'Заморожена, ждёт решения':(d.status==='completed'?'Спор завершён':(d.status==='cancelled'?'Возврат покупателю':d.status)))}
      <button class="btn btn-ghost btn-sm btn-block" style="margin-top:6px;" onclick="navigate('/chat/${esc(d.id)}')">${icon('chat',13)} Открыть чат</button>
    </div>`;
  return `<div class="card" style="padding:13px 14px;">
    <div class="row between" style="margin-bottom:4px;"><span class="h3" style="font-size:13.5px;">${esc(u.name)}</span><span class="badge" style="background:${st.color}22;color:${st.color};">${st.label}</span></div>
    <div class="faint" style="font-size:11px;font-family:monospace;margin-bottom:6px;">ID: ${esc(u.id)} · IP: ${esc(u.ip||'—')}</div>
    ${cur ? `<div style="border-left:3px solid ${st.color};padding:2px 0 2px 10px;margin:6px 0;">${line('Причина', cur.reason)}${line('Кто', who(cur))}${line('Когда', logTime(cur.ts))}${line('Как', cur.how)}</div>` : (u.status!=='active' ? `<div class="faint" style="font-size:11.5px;margin:6px 0;">Причина не указана (ограничение поставлено до появления этого поля)</div>` : '')}
    ${frozen.length ? `<div style="font-size:12px;font-weight:700;margin-top:8px;color:var(--warning);">Замороженные сделки (${frozen.length})</div>${frozen.map(dealHtml).join('')}` : ''}
    ${past.length ? `<div style="font-size:12px;font-weight:700;margin-top:10px;">Завершённые споры (${past.length})</div>${past.map(dealHtml).join('')}` : ''}
    ${hist.length ? `<div style="font-size:12px;font-weight:700;margin-top:10px;">История ограничений</div>${hist.map(r=>`<div class="faint" style="font-size:11.5px;line-height:1.5;margin-top:4px;">${logTime(r.ts)} · ${r.kind==='banned'?(r.on?'Бан':'Разбан'):(r.on?'Заморозка':'Разморозка')} · ${esc(who(r))}${r.reason?' · '+esc(r.reason):''}</div>`).join('')}` : ''}
  </div>`;
}
function renderRestrictedList(){
  const el = document.getElementById('restricted-list'); if(!el) return;
  const q = adminRestrQuery.trim().toLowerCase();
  let users = allUsers().filter(u=>u.id!=='me');
  if(q) users = users.filter(u=>u.id.toLowerCase().includes(q) || (u.name||'').toLowerCase().includes(q) || (u.ip||'').toLowerCase().includes(q));
  else users = users.filter(u=>u.status==='banned' || u.status==='frozen' || userFrozenDeals(u).length>0);
  if(users.length===0){
    el.innerHTML = `<div class="empty-state">${icon('search',34,'var(--text-faint)')}<div class="h2">${q?'Никого не нашли':'Пока никого нет'}</div><div class="muted" style="font-size:13px;">${q?'Проверьте ID и попробуйте снова':'Забаненных и замороженных нет'}</div></div>`;
    return;
  }
  el.innerHTML = (q?'':`<div class="faint" style="font-size:12px;margin-bottom:2px;">Всего: ${users.length}</div>`) + users.map(restrictedCardHtml).join('');
}

function accGenPw(len){

}

function supportChatRowHtml(){
  const t = supportThreadMe(false);
  const last = t && t.messages.length ? t.messages[t.messages.length-1] : null;
  return `<div class="listing" style="margin-bottom:8px;" onclick="navigate('/chat/support')">
    <div class="avatar" style="width:52px;height:52px;background:#000;overflow:hidden;"><img src="${SUPPORT_AVATAR}" style="width:100%;height:100%;object-fit:cover;"></div>
    <div style="flex:1;min-width:0;">
      <div class="row between"><span class="h3" style="font-size:14px;">Поддержка</span><span class="faint" style="font-size:11px;">${last?timeAgo(last.ts):''}</span></div>
      <div class="muted" style="font-size:12.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${last ? (last.from==='user'?'Вы: ':'')+esc(last.text) : 'Напишите нам, если нужна помощь'}</div>
    </div>
    ${supportUnreadMe()>0?`<div style="width:9px;height:9px;border-radius:50%;background:var(--danger);align-self:flex-start;margin-top:6px;"></div>`:''}
  </div>`;
}
function pageSupportChat(){
  const t = supportThreadMe(false);
  if(t && t.unreadUser){ t.unreadUser = 0; saveState(); }
  const msgs = t ? t.messages : [];
  const authed = !!state.authed;
  const news = Array.isArray(ensureSupport().news) ? ensureSupport().news : [];
  return `
  <div class="chat-page">
    ${topbar({back:true, title:`<span style="display:inline-flex;align-items:center;gap:9px;"><img src="${SUPPORT_AVATAR}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;"><span>Поддержка</span></span>`, subtitle:'Ответим на ваши вопросы'})}
    <div id="msgScroll" class="chat-msgs">
      ${news.map(n=>`<div class="msg-row in"><div class="bubble">${esc(n.text||'')}</div></div>`).join('')}
      ${msgs.length===0 && news.length===0 ? `<div class="msg-row sys"><div class="bubble">${authed ? 'Опишите вопрос. Мы ответим в этом чате.' : 'Здесь будут новости, акции и публикации площадки. Писать в чат могут только игроки с аккаунтом.'}</div></div>` : ''}
      ${msgs.map(m=>msgWithTag(m.from==='user' ? whoUserHTML((t&&t.userId)||'') : whoAdminHTML(m.by||'owner'), `<div class="bubble">${esc(m.text)}</div>`, m.from==='user')).join('')}
    </div>
  </div>
  <div class="chat-bottom-stack">
    ${authed ? `<div class="chat-input-bar">
      <input class="input" id="chatInputField" placeholder="Сообщение в поддержку..." style="flex:1;" value="${esc(window.__chatInputValue||'').replace(/"/g,'&quot;')}">
      <div class="icon-btn accent" onclick="sendMessage('support')">${icon('send',17,'#fff')}</div>
    </div>` : `<div style="padding:12px 14px;">
      <button class="btn btn-primary btn-block" onclick="requireAuth('Чтобы написать в поддержку, войдите в аккаунт')">${icon('lock',15,'#fff')} Войдите, чтобы написать</button>
    </div>`}
  </div>`;
}
function sendSupportMessage(text, input){
  if(!state.authed){ requireAuth('Чтобы написать в поддержку, войдите в аккаунт'); return; }
  const t = supportThreadMe(true);
  t.userName = state.me.name || t.userName; t.userId = supportUidMe() || t.userId;
  t.messages.push({from:'user', text:text.slice(0,2000), ts:Date.now()});
  t.updatedAt = Date.now(); t.unreadAdmin = (t.unreadAdmin||0) + 1;
  if(input) input.value = ''; window.__chatInputValue = '';
  saveState(); onRoute(); focusChatInput();
}
let adminSupportDraft = '';
function pageAdminSupport(parts){
  if(!canSupport()) return adminGuard('Чат поддержки');
  const sp = ensureSupport(), key = parts[0];
  if(!key){
    const list = Object.values(sp.threads).sort((a,b)=>b.updatedAt-a.updatedAt);
    return `${topbar({title:'Чат поддержки', back:true, solid:true})}
    <div class="page">
      ${list.length===0 ? `<div class="empty-state">${icon('support',36,'var(--text-faint)')}<div class="h2">Сообщений пока нет</div><div class="muted" style="font-size:13px;">Здесь появятся обращения игроков из чата «Поддержка»</div></div>` :
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${list.map(t=>{
        const last = t.messages[t.messages.length-1];
        const lastUser = [...t.messages].reverse().find(m=>m.from==='user') || last;
        const unread = t.unreadAdmin||0;
        return `<div class="card" style="padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;" onclick="navigate('/admin/support/${encodeURIComponent(t.key)}')">
          <div class="row between" style="gap:6px;"><span style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.userName)}</span>${unread>0?`<span class="badge" style="background:var(--danger);color:#fff;">${unread}</span>`:''}</div>
          <div class="faint" style="font-size:10.5px;font-family:monospace;">ID: ${esc(t.userId||'—')}</div>
          <div class="muted" style="font-size:12px;line-height:1.4;max-height:50px;overflow:hidden;word-break:break-word;">${esc((lastUser?lastUser.text:'').slice(0,90))}</div>
          <div class="faint" style="font-size:10.5px;">${last?timeAgo(last.ts):''}${last&&last.from==='admin'?' · вы ответили':''}</div>
          <button class="btn btn-accent2 btn-sm btn-block" style="margin-top:2px;" onclick="event.stopPropagation(); navigate('/admin/support/${encodeURIComponent(t.key)}')">${icon('send',13)} Ответить</button>
        </div>`; }).join('')}</div>`}
    </div>`;
  }
  const t = sp.threads[key];
  if(!t) return page404();
  if(t.unreadAdmin){ t.unreadAdmin = 0; saveState(); }
  return `${topbar({title:esc(t.userName), subtitle:'ID: '+esc(t.userId||'—'), back:true, solid:true})}
  <div class="page">
    <div style="display:flex;flex-direction:column;margin-bottom:14px;">
      ${t.messages.map(m=>`<div class="msg-row ${m.from==='admin'?'out':'in'}" style="flex-direction:column;align-items:${m.from==='admin'?'flex-end':'flex-start'};">
        <div class="bubble">${esc(m.text)}</div>
        <div class="faint" style="font-size:10px;margin:2px 4px 6px;">${m.from==='admin'?whoAdminHTML(m.by||'owner'):whoUserHTML(t.userId||'')} · ${logTime(m.ts)}</div>
      </div>`).join('')}
      <div id="supportThreadEnd"></div>
    </div>
    <div class="card" style="padding:12px;">
      <textarea class="textarea" id="supportReplyInput" placeholder="Ответ игроку..." style="min-height:70px;margin-bottom:8px;" oninput="adminSupportDraft=this.value;">${esc(adminSupportDraft)}</textarea>
      <button class="btn btn-accent2 btn-block" onclick="adminSupportReply('${esc(t.key)}')">${icon('send',15)} Ответить</button>
    </div>
  </div>`;
}
function adminSupportReply(key){
  if(!canSupport()) return;
  const el = document.getElementById('supportReplyInput');
  const text = (el ? el.value : adminSupportDraft).trim();
  if(!text){ toast('Введите ответ','error'); return; }
  const t = ensureSupport().threads[key]; if(!t) return;
  t.messages.push({from:'admin', text:text.slice(0,2000), ts:Date.now(), by:(ADMIN.staffId||'owner'), role:ADMIN.role});
  t.updatedAt = Date.now(); t.unreadUser = (t.unreadUser||0) + 1;
  adminSupportDraft = '';
  logOp('Ответ в поддержке', key, 'messages', {supportKey:key, to:t.userId, toName:t.userName, title:'Чат поддержки', text:text.slice(0,500)});
  saveState(); toast('Ответ отправлен','success'); onRoute();
}

function supportSheet(){
  const nm = (state.me && state.me.name && state.me.name!=='Вы') ? state.me.name : '';
  return `<div class="h2" style="margin-bottom:12px;">Поддержка</div>
  <input class="input" id="supId" placeholder="Ваш ID" value="${esc(supportUidMe())}" style="margin-bottom:8px;">

async function sendSupportEmail(){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const uid = g('supId'), name = g('supName'), msg = g('supText');
  if(!uid || !name || msg.length<5){ toast('Заполните ID, имя и описание','error'); return; }
  let last = 0; try{ last = +localStorage.getItem('obmenka_support_last') || 0; }catch(e){}
  if(Date.now()-last < 30000){ toast('Подождите немного перед повторной отправкой','error'); return; }
  const btn = document.getElementById('supSendBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Отправляем...'; }
  const subject = 'Обращение в поддержку';
  try{
    const res = await fetch('https://formsubmit.co/ajax/'+SUPPORT_EMAIL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({'ID':uid, 'Имя':name, 'Описание':msg, _subject:subject, _template:'table', _captcha:'false'})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || String(data.success)==='false') throw new Error('send failed');
    try{ localStorage.setItem('obmenka_support_last', String(Date.now())); }catch(e){}
    closeModal(); toast('Обращение отправлено на почту поддержки','success');
  }catch(e){
    const body = 'ID: '+uid+'\nИмя: '+name+'\n\n'+msg;
    closeModal();
    toast('Откроется почтовое приложение, нажмите «Отправить»');
    location.href = 'mailto:'+SUPPORT_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  }
}

function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = unescape(encodeURIComponent(str)); const bytes=[];
  for(let i=0;i<b.length;i++) bytes.push(b.charCodeAt(i));
  const l = bytes.length*8; bytes.push(0x80);
  while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4 ? 0 : (l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3), s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b2,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22), mj=(a&b2)^(a&c)^(b2&c), t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b2)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('');
}

function logOp(action, details, cat, data){
  if(!ADMIN) return;
  ensureStaff();
  const actor = ADMIN.staffId||'owner', now = Date.now();
  const last = state.logs[state.logs.length-1];
  if(last && last.actor===actor && last.action===action && (last.details||'')===(details||'') && (!cat || (cat==='views' && now-last.ts<60000)) && now-last.ts<(cat==='views'?60000:10000)) return;
  const e = {ts:now, role:ADMIN.role, actor, action, details:details||''};
  if(cat) e.cat = cat;
  if(data) e.data = data;
  state.logs.push(e);
  if(state.logs.length>3000) state.logs.splice(0, state.logs.length-3000);
  try{ actMirrorLog(e); }catch(_){}
}
function listingSnap(l){
  const sl = (state.sellers||[]).find(x=>x.id===l.sellerId);
  return {listingId:l.id, title:l.title, price:l.price, sellerId:l.sellerId, sellerName: sl?sl.name:''};
}
/* --- один сеанс на один доступ --- */
function lockKey(k){ return 'obmenka_adminlock_'+k; }
function lockRead(k){ try{ return JSON.parse(localStorage.getItem(lockKey(k))||'null'); }catch(e){ return null; } }
function lockAcquire(k){
  const l = lockRead(k), now = Date.now();
  if(l && l.sid!==SID && now-l.ts < 20000) return false;
  try{ localStorage.setItem(lockKey(k), JSON.stringify({sid:SID, ts:now})); }catch(e){ return false; }
  const c = lockRead(k); return !!(c && c.sid===SID);
}
function lockRelease(k){ const l = lockRead(k); if(l && l.sid===SID) try{ localStorage.removeItem(lockKey(k)); }catch(e){} }
function persistAdminSess(){ try{ if(ADMIN) sessionStorage.setItem(ADMIN_SESS_KEY, JSON.stringify(ADMIN)); else sessionStorage.removeItem(ADMIN_SESS_KEY); }catch(e){} }
function adminRestore(){
  try{
    const raw = sessionStorage.getItem(ADMIN_SESS_KEY); if(!raw) return;
    const a = JSON.parse(raw); ensureStaff();
    if(!ADMIN_ROLES[a.role]) return;
    if(a.role!=='owner'){ const st = state.staff[a.staffId]; if(!st || st.role!==a.role){ persistAdminSess(); sessionStorage.removeItem(ADMIN_SESS_KEY); return; } }
    if(!lockAcquire(a.key)){ sessionStorage.removeItem(ADMIN_SESS_KEY); return; }
    ADMIN = a;
  }catch(e){}
}
function forceExitAdmin(msg){
  if(ADMIN) lockRelease(ADMIN.key);
  ADMIN = null; persistAdminSess();
  if(msg) toast(msg,'error');
  if(currentHash().path.startsWith('/admin') || currentHash().path.startsWith('/seller/')) navigate('/profile'); else onRoute();
}
setInterval(function(){
  if(!ADMIN) return;
  const l = lockRead(ADMIN.key);
  if(l && l.sid!==SID && Date.now()-l.ts<20000){ forceExitAdmin('Доступ занят другим сеансом'); return; }
  if(ADMIN.role!=='owner'){
    ensureStaff(); try{ const st = (state.staff||{})[ADMIN.staffId];
      if(!st || st.role!==ADMIN.role){ forceExitAdmin('Ваши права отозваны'); return; } }catch(e){}
  }
  try{ localStorage.setItem(lockKey(ADMIN.key), JSON.stringify({sid:SID, ts:Date.now()})); }catch(e){}
}, 5000);
window.addEventListener('pagehide', function(){ if(ADMIN) lockRelease(ADMIN.key); });

function adminLogin(){
  const el = document.getElementById('adminPw'); const pw = el ? el.value : '';
  let f = {n:0, until:0}; try{ f = JSON.parse(localStorage.getItem('obmenka_admin_fail')||'null') || f; }catch(e){}
  if(Date.now() < f.until){ toast('Слишком много попыток. Подождите '+Math.ceil((f.until-Date.now())/1000)+' с','error'); return; }
  ensureStaff();
  const h = hashPw(pw);
  let role=null, staffId=null, key=null;
  if(h===MASTER_HASH){ role='owner'; key='owner'; }
  else { for(const id in state.staff){ if(state.staff[id].hash===h){ role=state.staff[id].role; staffId=id; key='staff_'+id; break; } } }
  if(!role){
    f.n++; if(f.n>=5){ f.until = Date.now()+60000; f.n=0; }
    try{ localStorage.setItem('obmenka_admin_fail', JSON.stringify(f)); }catch(e){}
    toast('Неверный пароль','error'); return;
  }
  if(!lockAcquire(key)){ toast('Этот доступ уже занят другим сеансом','error'); return; }
  try{ localStorage.removeItem('obmenka_admin_fail'); }catch(e){}
  ADMIN = {role, staffId, key}; persistAdminSess();
  try{ const info = {ts:Date.now(), device:deviceLabel(), ip:(state.me&&state.me.ip)||''}; if(role==='owner') state.ownerLast = info; else if(state.staff[staffId]) state.staff[staffId].last = info; }catch(e){}
  logOp('Вход в админ-режим'); saveState();
  closeModal(); toast('Вход выполнен: '+ADMIN_ROLES[role].label,'success'); navigate('/admin');
}
function exitAdminMode(){
  if(ADMIN){ logOp('Выход из админ-режима'); saveState(); lockRelease(ADMIN.key); }
  ADMIN = null; persistAdminSess();
  closeModal(); toast('Режим администратора выключен'); navigate('/profile');
}

function genStaffPw(){
  const ch='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r='';
  const a = new Uint32Array(36); (window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*4e9)}).getRandomValues(a);
  for(let i=0;i<36;i++) r+=ch[a[i]%ch.length];
  staffFormPw=r; onRoute();
}
function grantStaff(){
  if(!isOwner()){ toast('Выдавать админку может только главный админ','error'); return; }
  const id = staffFormId.trim(), pw = staffFormPw;
  if(!id){ toast('Введите ID игрока','error'); return; }
  if(id==='me'){ toast('Нельзя назначить роль на собственный ID','error'); return; }
  if(!allUsers().find(u=>u.id===id)){ toast('Игрок с таким ID не найден','error'); return; }
  if(pw.length<30){ toast('Пароль должен быть не короче 30 символов','error'); return; }
  const h = hashPw(pw);
  if(h===MASTER_HASH){ toast('Этот пароль использовать нельзя','error'); return; }
  ensureStaff();
  for(const k in state.staff){ if(k!==id && state.staff[k].hash===h){ toast('Такой пароль уже выдан другому','error'); return; } }
  state.staff[id] = {role:staffFormRole, hash:h, ts:Date.now(), by:'owner'};
  logOp('Выдана роль', id+' → '+ADMIN_ROLES[staffFormRole].label);
  staffFormId=''; staffFormPw='';
  saveState(); toast('Доступ выдан: '+ADMIN_ROLES[staffFormRole].label,'success'); onRoute();
}
function makeStaffCode(id){
  const st = state.staff && state.staff[id]; if(!st) return '';
  const json = JSON.stringify({i:id, r:st.role, h:st.hash});
  return 'ADM-' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function copyStaffCode(id){
  if(!isOwner()) return;
  const code = makeStaffCode(id); if(!code) return;
  const done = ()=>toast('Код скопирован. Отправьте его сотруднику вместе с паролем','success');
  try{ navigator.clipboard.writeText(code).then(done, ()=>{ prompt('Скопируйте код:', code); }); }
  catch(e){ prompt('Скопируйте код:', code); }
}
function importStaffCode(text){
  if(!/^ADM-[A-Za-z0-9_-]+$/.test(text)) return false;
  try{
    let b = text.slice(4).replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const o = JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!o || typeof o.i!=='string' || !/^[A-Za-z0-9_.-]{1,64}$/.test(o.i) || !ADMIN_ROLES[o.r] || o.r==='owner' || !/^[0-9a-f]{64}$/.test(o.h)) return false;
    if(o.h===MASTER_HASH) return false;
    ensureStaff();
    state.staff[o.i] = {role:o.r, hash:o.h, ts:Date.now(), by:'code'};
    try{ localStorage.setItem('obmenka_admin_unlocked','1'); }catch(e){}
    saveState();
    return true;
  }catch(e){ return false; }
}
function revokeStaff(id){
  if(!isOwner()) return;
  ensureStaff(); delete state.staff[id];
  logOp('Роль отозвана', id); saveState(); toast('Доступ отозван'); onRoute();
}

const ACT_SECS = [

function actKeyByRef(ref){
  ref = String(ref||'').trim(); if(!ref) return '';

  try{

/* то, что сделал админ, дублируем в ленту игрока: видно, кто именно вмешался */
function actPushAdmin(userKey, sec, info, sub){
  try{
    if(!userKey || !ADMIN) return;
    const st = actLoad(), arr = st[userKey] || (st[userKey] = []), now = Date.now();
    const who = ADMIN.staffId||'owner', text = String(info||'').slice(0,300), sb = String(sub||'').slice(0,70);
    const last = arr[arr.length-1];
    if(last && last[2]==='admin' && last[3]===text && last[6]===who && now-last[0]<30000) return;
    arr.push([now, sec, 'admin', text, sb, 0, who]);
    if(arr.length>3000) arr.splice(0, arr.length-3000);
    clearTimeout(actTimer); actTimer = setTimeout(actFlush, 1000);
  }catch(e){}
}
function actMirrorLog(e){
  try{
    const d = e.data || {}, a = e.action || '', cat = e.cat || logCat(e);
    const targets = [];
    const add = (ref, sec, info, sub)=>{ const k = actKeyByRef(ref); if(k) targets.push([k, sec, info, sub||'']); };
    if(cat==='messages'){
      const t = '«'+String(d.text||'').replace(/\s+/g,' ').slice(0,200)+'»';
      if(d.supportKey) add(d.supportKey, 'support', 'Ответил в чате поддержки: '+t, '');
      else add(d.toName || d.to, 'chats', 'Вмешался в чат'+(d.title?' «'+d.title+'»':'')+': '+t, d.title?'Чат: '+(d.toName||'')+' · '+String(d.title).slice(0,26):'');
    } else if(cat==='listings'){
      add(d.sellerName || d.sellerId, 'sell', (d.result||a)+': '+(d.title||'')+(d.reason?' · причина: '+d.reason:''), 'Мои объявления');
    } else if(cat==='bans'){
      const res = (d.result||a)+(d.reason?' · '+d.reason:'');
      if(/^(\d{1,3}\.){3}\d{1,3}$/.test(String(d.target||''))) String(d.name||'').split(/,\s*/).forEach(id=>add(id,'account',res,'Сессии'));
      else add(d.name || d.target, 'account', res, 'Сессии');
    } else if(cat==='disputes'){
      add(d.playerName || d.playerId, 'chats', (d.result||a)+(d.title?' · '+d.title:''), d.title?'Чат: '+(d.playerName||'')+' · '+String(d.title).slice(0,26):'');
    } else if(cat==='views'){
      add(d.target || e.details, 'account', a, 'Сессии');
    } else if(/пароля|от имени администратора/.test(a)){
      add(e.details, 'account', a, 'Сессии');
    }
    /* если админ сидит под аккаунтом игрока, то всё в чатах от его имени тоже на него */
    if(state && state.impersonation && state.impersonation.kind==='user' && cat==='messages' && !d.supportKey)
      add(state.impersonation.label, 'chats', 'Написал от имени аккаунта'+(d.title?' в чате «'+d.title+'»':'')+': «'+String(d.text||'').replace(/\s+/g,' ').slice(0,200)+'»', d.title?'Чат: '+(d.toName||'')+' · '+String(d.title).slice(0,26):'');
    targets.forEach(t=>actPushAdmin(t[0], t[1], t[2], t[3]));
  }catch(err){}
}
let actStore = null, actTimer = null, actQuery = '', actView = 'grids', actCur = null;
function actEnc(s){ return encodeURIComponent(String(s)).replace(/'/g,'%27'); }
function actLoad(){
  if(actStore) return actStore;
  try{ actStore = JSON.parse(localStorage.getItem(ACT_KEY)||'{}') || {}; }catch(e){ actStore = {}; }
  const limit = Date.now() - 60*86400000;
  Object.keys(actStore).forEach(k=>{ actStore[k] = (actStore[k]||[]).filter(e=>e[0]>limit); });
  return actStore;
}
function actFlush(){
  try{ localStorage.setItem(ACT_KEY, JSON.stringify(actStore)); return; }catch(e){}
  [1500, 600, 300].some(function(n){
    try{ Object.keys(actStore).forEach(k=>{ actStore[k] = actStore[k].slice(-n); }); localStorage.setItem(ACT_KEY, JSON.stringify(actStore)); return true; }catch(_){ return false; }
  });
}
function actKey(){ return state && state.authed ? (state.accKey || String((state.me||{}).name||'').trim().toLowerCase() || 'guest') : 'guest'; }
/* запись: [время, раздел, действие, текст, сетка (чат / игра / товар), секунды] */
function actPush(key, sec, act, info, sub, num){
  const st = actLoad(), arr = st[key] || (st[key] = []), now = Date.now(), last = arr[arr.length-1];
  if(last && last[1]===sec && last[2]===act && last[3]===String(info||'').slice(0,300) && now-last[0]<400) return;
  arr.push([now, sec, act, String(info||'').slice(0,300), String(sub||'').slice(0,70), num||0]);
  if(arr.length>3000) arr.splice(0, arr.length-3000);
  clearTimeout(actTimer); actTimer = setTimeout(actFlush, 1000);
}
function actLog(sec, act, info, sub){
  try{
    if(!state || state.impersonation) return;
    const p = currentHash().path;
    if(p.startsWith('/admin') || p.startsWith('/dev')) return;
    actPush(actKey(), sec, act, info, sub);
  }catch(e){}
}
function actChatSub(d, id){ return d ? 'Чат: '+d.counterparty.name+' · '+String(d.listingTitle||'').slice(0,26) : 'Чат: '+id; }
function actDescribe(path, params){
  const gname = id => { const g = GAMES.find(x=>x.id===id); return g ? g.name : id; };
  if(path==='/') return {sec:'home', label:'Главная', sub:''};
  if(path==='/catalog') return params.game ? {sec:'games', label:'Каталог игры «'+gname(params.game)+'»', sub:gname(params.game)} : {sec:'catalog', label:'Каталог', sub:''};
  if(path==='/games') return {sec:'games', label:'Список игр', sub:'Список игр'};
  if(path.startsWith('/item/')){ const l = state.listings.find(x=>x.id===path.split('/')[2]); const g = l ? GAMES.find(x=>x.id===l.gameId) : null; return {sec:'item', label:'Товар: '+(l?l.title:path.split('/')[2])+(g?' · '+g.name:'')+(l&&l.price!=null?' · '+fmtPrice(l.price):''), sub:l?l.title.slice(0,50):''}; }

function actFmtDur(s){
  s = Math.round(s||0);
  if(s<60) return s+' сек';
  if(s<3600) return Math.floor(s/60)+' мин '+(s%60)+' сек';
  return Math.floor(s/3600)+' ч '+Math.floor((s%3600)/60)+' мин';
}

    const oc = el.getAttribute('onclick')||'';

    if(!label){ const m = /^\s*([A-Za-z_]\w*)/.exec(oc); label = m ? 'Кнопка ('+m[1]+')' : 'Кнопка'; }
    const nav = /navigate\(\s*['"`]([^'"`]+)/.exec(oc);
    if(nav){ let to = nav[1]; try{ to = decodeURIComponent(to); }catch(_){} label += ' → '+to.slice(0,60); }
    const h = currentHash(), d = actDescribe(h.path, h.params);
    let sec = d.sec, sub = d.sub||'';
    if(h.path==='/catalog'){
      const gm = GAMES.find(g=>label===g.name || label.indexOf(g.name+' →')===0);
      if(gm){ sec = 'games'; sub = gm.name; }
      else if(catalogFilters && catalogFilters.game){ const g2 = GAMES.find(g=>g.id===catalogFilters.game); if(g2){ sec = 'games'; sub = g2.name; } }
    }

}

function actDayTitle(ts){ return new Date(ts).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}); }
function actStats(arr){
  const d0 = new Date(); d0.setHours(0,0,0,0);

  let today = 0, dwell = 0, msgs = 0, searches = 0, clicks = 0;
  arr.forEach(e=>{

/* проверка и подготовка списков перед сохранением */
function devSpecsPrepare(){
  const out = {};
  for(const c of Object.keys(devDraft.specs)){
    const list = devDraft.specs[c]; if(!Array.isArray(list)) continue;
    const seen = {}, clean = [];
    for(const f of list){
      const label = String(f.label||'').trim();
      const fail = m=>{ devDraft.specCat = c; return {err: m+' ('+c+')'}; };
      if(label.length<2) return fail('Укажите название характеристики');
      if(seen[label.toLowerCase()]) return fail('Название повторяется: '+label);
      seen[label.toLowerCase()] = 1;
      const r = {k: f.k || ('c_'+Math.random().toString(36).slice(2,7)), label, t: SPEC_TYPES[f.t] ? f.t : 'txt'};
      if(r.t==='sel'){
        r.o = Array.from(new Set((f.o||[]).map(x=>String(x).trim()).filter(Boolean)));
        if(r.o.length<2) return fail('В списке «'+label+'» нужно минимум 2 варианта');
      }
      if(r.t==='txt' && f.ph) r.ph = String(f.ph).trim().slice(0,60);
      clean.push(r);
    }
    out[c] = clean;
  }
  return {out};
}
function devSpecsCommit(gid, out){
  if(!state.specEdits) state.specEdits = {};
  Object.keys(out).forEach(c=>{ state.specEdits[gid+'|'+c] = out[c]; });
  if(devDraft && devDraft.reset) Object.keys(devDraft.reset).forEach(c=>{ delete state.specEdits[gid+'|'+c]; });
  logOp('Изменены характеристики', gid, 'dev');
}

function submitReviewReport(sellerId, idx, reasonIdx){

  state.reports.unshift({id:uid('rep'), type:'review', sellerId, sellerName:seller.name, reviewTs:r.ts, author:r.author, text:r.text, reason:REPORT_REASONS[reasonIdx], by, ts:Date.now(), status:'new'});

  saveState(); closeModal(); toast('Жалоба отправлена','success');

function logCat(l){
  if(l.cat) return l.cat;
  const a = l.action||'';
  if(/Спор/.test(a)) return 'disputes';
  if(/публикац|Публикац/.test(a)) return 'listings';
  if(/Бан|Заморозка/.test(a)) return 'bans';
  return 'access';
}
function logTime(ts){ return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function logActors(){
  ensureStaff();
  const map = {owner:{actor:'owner', role:'owner', count:0, last:0}};
  Object.keys(state.staff).forEach(id=>{ map[id] = {actor:id, role:state.staff[id].role, count:0, last:0}; });
  state.logs.forEach(l=>{
    const a = map[l.actor] || (map[l.actor] = {actor:l.actor, role:l.role, count:0, last:0});
    a.count++; if(l.ts>a.last) a.last = l.ts;
  });
  return Object.values(map).sort((x,y)=>y.last-x.last);
}

function logEntryHTML(l, cat){
  const d = l.data || {};
  const head = (t, right)=>`<div class="row between" style="gap:8px;margin-bottom:4px;"><span style="font-size:12.5px;font-weight:700;">${t}</span><span class="faint" style="font-size:10.5px;white-space:nowrap;">${logTime(l.ts)}</span></div>`;
  const btn = (label, route)=>`<button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px;" onclick="navigate('${route}')">${label}</button>`;
  const line = (k,v)=>v?`<div class="faint" style="font-size:11.5px;line-height:1.5;"><span style="opacity:.7;">${k}:</span> ${esc(v)}</div>`:'';
  const whoRow = `<div style="margin-bottom:6px;">${whoAdminHTML(l.actor)}</div>`;
  let body = '';
  if(cat==='messages'){
    body = head('Сообщение игроку') + line('Кому', (d.toName||'')+(d.to?' ('+d.to+')':'')) + line('Сделка', d.title)
      + `<div style="margin-top:6px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;word-break:break-word;">${esc(d.text||'')}</div>`
      + (d.supportKey ? btn('Открыть переписку','/admin/support/'+encodeURIComponent(d.supportKey)) : (d.dealId ? btn('Открыть чат','/chat/'+esc(d.dealId)) : ''));
  } else if(cat==='listings'){
    body = head(esc(d.result||l.action)) + line('Причина', d.reason) + line('Публикация', d.title) + line('Цена', d.price!=null?fmtPrice(d.price):'') + line('Продавец', (d.sellerName||'')+(d.sellerId?' ('+d.sellerId+')':''))
      + (d.listingId ? btn('Посмотреть публикацию','/item/'+esc(d.listingId)) : line('Публикация ID', l.details));
  } else if(cat==='bans'){
    body = head(esc(d.result||l.action)) + line('Аккаунт', (d.name||'')+(d.target?' ('+d.target+')':'')) + line('IP', d.ip) + line('Причина', d.reason) + (!d.target ? line('Данные', l.details) : '');
  } else if(cat==='disputes'){
    body = head(esc(d.result||l.action)) + line('Игрок', (d.playerName||'')+(d.playerId?' ('+d.playerId+')':'')) + line('Сделка', d.title) + line('Сумма', d.price!=null?fmtPrice(d.price):'')
      + (d.dealId ? btn('Открыть чат','/chat/'+esc(d.dealId)) : line('Сделка ID', l.details));
  } else if(cat==='views'){
    const tu = (()=>{ try{ return accUsers().find(u=>u.uid===d.target||u.key===String(d.target||'').toLowerCase()); }catch(e){ return null; } })();
    body = head(esc(l.action)) + line('Игрок', (d.name||(tu?tu.nickname:''))+(d.target?' (ID: '+d.target+')':''));
  } else {
    const tu = (()=>{ try{ return accUsers().find(u=>u.key===String(l.details||'').toLowerCase()||u.uid===l.details||String(u.nickname||'').toLowerCase()===String(l.details||'').toLowerCase()); }catch(e){ return null; } })();
    body = head(esc(l.action)) + (tu ? line('Игрок', tu.nickname+' (ID: '+tu.uid+')') : line('Подробности', l.details));
  }
  return `<div class="card" style="padding:11px 13px;">${whoRow}${body}</div>`;
}
