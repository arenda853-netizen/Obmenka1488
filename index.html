      if(ACCOUNTS_API_URL){
        try{
          const res = await fetch(ACCOUNTS_API_URL.replace(/\/$/,'') + '/' + encodeURIComponent(key));
          if(res.status === 404) return null;
          if(res.ok) return await res.json();
        }catch(e){}
      }
      const db = readLocalAccounts();
      return db[key] || null;
    },
    async save(nickname, password){
      const key = (nickname || '').trim().toLowerCase();
      if(ACCOUNTS_API_URL){
        try{
          const res = await fetch(ACCOUNTS_API_URL, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nickname: key, salt: (window.__pwSalt = newPwSalt()), passHash: userPwHash(password, window.__pwSalt) })
          });
          if(res.ok) return true;
        }catch(e){}
      }
      const db = readLocalAccounts();
      db[key] = { nickname: key, salt: (window.__pwSalt2 = newPwSalt()), passHash: userPwHash(password, window.__pwSalt2), uid: newAccUid(), device: deviceLabel(), ip: ((typeof state!=='undefined' && state && state.me && state.me.ip) || ''), createdAt: Date.now(), lastLogin: Date.now() };
      writeLocalAccounts(db);
      return true;
    }
  };
  function applyLocalUser(nickname){
    try{
      if((typeof state === 'undefined' || state === null) && typeof loadState === 'function'){
        loadState();
      }
      try{
        if(typeof ADMIN !== 'undefined' && ADMIN){ lockRelease(ADMIN.key); ADMIN = null; }
        persistAdminSess();
        localStorage.removeItem('obmenka_admin_unlocked');
      }catch(e){}
      if(typeof state !== 'undefined' && state && state.me){
        dealsSwitchTo(nickname);
        state.me.name = nickname;
        state.authed = true;
        try{ actLog('account','session','Вход в аккаунт · '+deviceLabel(),'Сессии'); }catch(e){}
        if(typeof saveState === 'function') saveState();
        if(typeof onRoute === 'function') onRoute();
      }
    }catch(e){}
  }
  function authModalContent(mode, error){
    mode = mode || 'login';
    const isLogin = mode === 'login';
    return `
    <div style="padding:22px;max-width:320px;">
      <div class="h2" style="margin-bottom:4px;">${isLogin ? 'Вход' : 'Регистрация'}</div>
      <div class="muted" style="font-size:13px;margin-bottom:16px;">${isLogin ? 'Введите ник и пароль, указанные при регистрации.' : 'Придумайте ник и пароль — они понадобятся для входа с любого устройства.'}</div>
      ${error ? `<div style="color:var(--danger);font-size:13px;margin-bottom:12px;">${error}</div>` : ''}
      <input id="authNickInput" class="input" placeholder="Ник" style="margin-bottom:10px;width:100%;" autocomplete="username">
      <input id="authPassInput" type="password" class="input" placeholder="Пароль" style="margin-bottom:16px;width:100%;" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      <button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="${isLogin ? 'submitLocalLogin()' : 'submitLocalRegister()'}">
        ${isLogin ? 'Войти' : 'Зарегистрироваться'}
      </button>
      <button class="btn btn-ghost btn-block" onclick="openAuthModal('${isLogin ? 'register' : 'login'}')">
        ${isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
      </button>
      ${isLogin ? `<div class="faint" style="font-size:11.5px;text-align:center;margin-top:14px;cursor:pointer;text-decoration:underline;" onclick="showForgotPasswordInfo()">Забыли пароль?</div>` : ''}
    </div>`;
  }
  window.showForgotPasswordInfo = function(){
    toastOrAlert('Восстановление пароля пока доступно только через администратора. Обратитесь в поддержку и укажите свой ник.', 'default');
  };
  window.openAuthModal = function(mode, error){
    if(typeof openModal === 'function'){ openModal(authModalContent(mode, error)); }
  };
  window.submitLocalRegister = async function(){
    const nickEl = document.getElementById('authNickInput');
    const passEl = document.getElementById('authPassInput');
    const nickname = nickEl ? nickEl.value.trim() : '';
    const password = passEl ? passEl.value : '';
    if(!nickname || !password){ openAuthModal('register', 'Введите ник и пароль.'); return; }
    if(password.length < 4){ openAuthModal('register', 'Пароль должен быть не короче 4 символов.'); return; }
    const existing = await ACCOUNTS_DB.find(nickname);
    if(existing){ openAuthModal('register', 'Такой ник уже занят, придумайте другой.'); return; }
    await ACCOUNTS_DB.save(nickname, password);
    applyLocalUser(nickname);
    if(typeof closeModal === 'function') closeModal();
    toastOrAlert('Вы зарегистрированы! Привет, ' + nickname, 'success');
  };
  window.submitLocalLogin = async function(){
    const nickEl = document.getElementById('authNickInput');
    const passEl = document.getElementById('authPassInput');
    const nickname = nickEl ? nickEl.value.trim() : '';
    const password = passEl ? passEl.value : '';
    if(!nickname || !password){ openAuthModal('login', 'Введите ник и пароль.'); return; }
    const account = await ACCOUNTS_DB.find(nickname);
    if(!account || !(account.passHash ? userPwHash(password, account.salt||'') === account.passHash : account.password === password)){
      openAuthModal('register', 'Такого аккаунта нет. Придумайте ник и пароль, чтобы зарегистрироваться.');
      return;
    }
    try{ const db = readLocalAccounts(), k = nickname.trim().toLowerCase(); if(db[k]){ db[k].lastLogin = Date.now(); db[k].device = deviceLabel(); db[k].ip = ((state&&state.me&&state.me.ip)||db[k].ip||''); if(!db[k].uid) db[k].uid = newAccUid(); writeLocalAccounts(db); } }catch(e){}
    applyLocalUser(nickname);
    if(typeof closeModal === 'function') closeModal();
    toastOrAlert('Успешный вход! Привет, ' + nickname, 'success');
  };
</script>
<script>
/* Zyro sync: общая БД на сервере вместо localStorage. Грузится после основного скрипта. */
(function(){
'use strict';
var TK='zyro_token',AK='zyro_admin',IDC=['sellers','listings','reports','support','activity'],
KV=['gameEdits','specEdits','customGames','noHold','logs','ownerLast','staff'],
ACCK=['me','deals','myListings','favorites','notifications','statsHistory'];
var rev=-1,snap={},kvs={},accSnap='',timer=null,busy=false,ready=false,ME0='{}',ACC={},accS={};
function tok(){return localStorage.getItem(TK)||'';}
function adm(){try{return JSON.parse(sessionStorage.getItem(AK)||'null');}catch(e){return null;}}
function myId(){return state.authed&&state.accKey?'u_'+state.accKey:null;}
async function api(p,body){
  var h={'content-type':'application/json'},a=adm();
  if(tok())h['x-token']=tok(); if(a)h['x-admin']=a.token;
  var r=await fetch(p,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok){var e=new Error(j.error||'Ошибка сети');e.status=r.status;throw e;}
  return j;
}
function ownSeller(){var m=state.me;return {id:myId(),name:m.name,rating:m.rating,deals:m.deals,color:m.color,verified:m.verified,photo:m.photo||null,reviews:m.reviews||[],real:true};}
function localMap(k){
  var o={},my=myId();
  if(k==='sellers'){(state.sellers||[]).forEach(function(s){if(s.id!==my)o[s.id]=s;});if(my&&state.me)o[my]=ownSeller();}
  else if(k==='listings'){(state.listings||[]).forEach(function(l){o[l.id]=l.sellerId==='me'&&my?Object.assign({},l,{sellerId:my}):l;});}
  else if(k==='reports'){(state.reports||[]).forEach(function(r){if(!r.id)r.id='r'+Math.random().toString(36).slice(2,9);o[r.id]=r;});}
  else if(k==='support'){Object.assign(o,(state.support&&state.support.threads)||{});}
  else if(k==='activity'){var s=typeof actStore==='object'&&actStore||{};Object.keys(s).forEach(function(x){o[x]=(s[x]||[]).slice(-300);});}
  return o;
}
function accPayload(){var p={};ACCK.forEach(function(k){p[k]=state[k];});return p;}
function resnap(){
  IDC.forEach(function(k){var m=localMap(k),s={};for(var id in m)s[id]=JSON.stringify(m[id]);snap[k]=s;});
  KV.forEach(function(k){kvs[k]=JSON.stringify(state[k]===undefined?null:state[k]);});
  accSnap=JSON.stringify(accPayload());
}
async function push(){
  if(busy||!ready||state.impersonation)return;
  var ops=[],marks=[],a=adm(),i;
  IDC.forEach(function(k){
    var cur=localMap(k),s=snap[k]||(snap[k]={}),id,j;
    for(id in cur){j=JSON.stringify(cur[id]);if(s[id]!==j){ops.push({k:k,id:id,v:cur[id]});marks.push([k,id,j]);}}
    for(id in s)if(!(id in cur)){ops.push({k:k,id:id,v:null});marks.push([k,id,null]);}
  });
  if(a)KV.forEach(function(k){var j=JSON.stringify(state[k]===undefined?null:state[k]);if(kvs[k]!==j){ops.push({k:k,v:state[k]===undefined?null:state[k]});marks.push(['kv',k,j]);}});
  var acc=null,aj=accSnap;
  if(tok()&&state.authed&&state.me){aj=JSON.stringify(accPayload());if(aj!==accSnap)acc=accPayload();}
  if(!ops.length&&!acc)return;
  busy=true;
  try{
    var r=await api('/api/sync',{ops:ops,acc:acc});
    marks.forEach(function(m){if(m[0]==='kv')kvs[m[1]]=m[2];else if(m[2]===null)delete snap[m[0]][m[1]];else snap[m[0]][m[1]]=m[2];});
    if(acc)accSnap=aj;
    if(r.prev===rev)rev=r.rev;
  }catch(e){if(e.status===401&&tok()){localStorage.removeItem(TK);toast('Сессия истекла, войдите снова','error');}}
  busy=false;
}
function save(){clearTimeout(timer);timer=setTimeout(function(){timer=null;push();},300);}
async function flush(){clearTimeout(timer);timer=null;while(busy)await new Promise(function(r){setTimeout(r,50);});await push();}
function apply(j){
  var my=myId(),i;
  if(j.idc.sellers)state.sellers=Object.keys(j.idc.sellers).map(function(k){return j.idc.sellers[k];}).filter(function(s){return s.id!==my;});
  if(j.idc.listings)state.listings=Object.keys(j.idc.listings).map(function(k){var l=j.idc.listings[k];return my&&l.sellerId===my?Object.assign({},l,{sellerId:'me'}):l;});
  if(j.idc.reports)state.reports=Object.keys(j.idc.reports).map(function(k){return j.idc.reports[k];});
  if(!state.support)state.support={threads:{}};
  state.support.threads=j.idc.support||{};
  if(j.admin&&j.idc.activity)window.actStore=j.idc.activity;
  Object.keys(j.kv||{}).forEach(function(k){if(j.kv[k]!==null)state[k]=j.kv[k];});
  if(!state.staff)state.staff={};if(!Array.isArray(state.logs))state.logs=[];
  ACC=j.accounts||{};
  if(j.acc&&j.acc.data)ACCK.forEach(function(k){if(j.acc.data[k]!==undefined)state[k]=j.acc.data[k];});
  if(typeof ADMIN!=='undefined'&&ADMIN&&!j.admin){sessionStorage.removeItem(AK);forceExitAdmin('Сессия администратора завершена');}
  resnap();
}
async function pull(force){
  var j=await api('/api/sync?rev='+(force?-1:rev));
  if(j.same)return false;
  if(!force&&(timer||busy))return false;
  rev=j.rev;apply(j);return true;
}
function rerender(){
  var a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(document.querySelector('.modal-sheet'))return;
  var p=currentHash().path;if(p.indexOf('/chat/')===0||p==='/sell'||p==='/profile/edit')return;
  var y=window.scrollY;onRoute();window.scrollTo(0,y);
}
async function poll(){
  if(document.hidden||!ready)return;
  try{if(await pull(false))rerender();}catch(e){}
}
function freshMe(){return JSON.parse(ME0);}
async function enter(j){
  localStorage.setItem(TK,j.token);
  state.authed=true;state.accKey=j.key;
  state.deals=[];state.notifications=[];state.myListings=[];state.favorites=[];
  state.me=freshMe();state.me.name=j.name;state.me.balance=0;
  await pull(true);
  if(state.me)state.me.name=j.name;
  closeModal();onRoute();
}
async function authCall(path,mode){
  var n=document.getElementById('authNickInput'),p=document.getElementById('authPassInput');
  var nick=n?n.value.trim():'',pw=p?p.value:'';
  if(!nick||!pw){openAuthModal(mode,'Введите ник и пароль.');return null;}
  try{return await api(path,{nick:nick,password:pw,device:deviceLabel()});}
  catch(e){openAuthModal(e.status===404?'register':mode,e.message);return null;}
}
var W=window;
W.saveState=save;
W.loadState=function(){state=seedState();migrateState();applyGameEdits();};
W.dealsStash=function(){};
W.dealsSwitchTo=function(k){state.accKey=String(k||'').trim().toLowerCase();};
W.dealsClear=function(){state.accKey=null;state.deals=[];state.notifications=[];state.myListings=[];state.favorites=[];state.me=freshMe();};
W.readAccDb=function(){return ACC;};
W.writeAccDb=function(db){if(!adm())return;var ops=[];Object.keys(db).forEach(function(k){if(JSON.stringify(db[k])!==JSON.stringify(ACC[k]))ops.push({k:'accounts',id:k,v:db[k]});});ACC=db;if(ops.length)api('/api/sync',{ops:ops}).catch(function(){});};
W.actLoad=function(){return typeof actStore==='object'&&actStore?actStore:(window.actStore={});};
W.actFlush=save;
W.lockRead=function(){return null;};W.lockAcquire=function(){return true;};W.lockRelease=function(){};
W.submitLocalRegister=async function(){var j=await authCall('/api/auth/register','register');if(j){await enter(j);toast('Вы зарегистрированы! Привет, '+j.name,'success');}};
W.submitLocalLogin=async function(){var j=await authCall('/api/auth/login','login');if(j){await enter(j);toast('Успешный вход! Привет, '+j.name,'success');}};
W.logoutAccount=async function(){
  try{actLog('account','session','Вышел из аккаунта','Сессии');}catch(e){}
  await flush();
  try{await api('/api/auth/logout',{});}catch(e){}
  localStorage.removeItem(TK);sessionStorage.removeItem(AK);
  ADMIN=null;persistAdminSess();state.authed=false;dealsClear();closeModal();toast('Вы вышли из аккаунта');
  rev=-1;try{await pull(true);}catch(e){}navigate('/');onRoute();
};
W.adminRestore=function(){var a=adm();if(a)ADMIN={role:a.role,staffId:a.staffId||null,key:a.staffId?'staff_'+a.staffId:'owner'};};
W.adminLogin=async function(){
  var el=document.getElementById('adminPw');
  try{
    var j=await api('/api/admin/login',{password:el?el.value:''});
    sessionStorage.setItem(AK,JSON.stringify(j));adminRestore();persistAdminSess();
    await pull(true);logOp('Вход в админ-режим');closeModal();toast('Вход выполнен: '+ADMIN_ROLES[j.role].label,'success');navigate('/admin');
  }catch(e){toast(e.message,'error');}
};
W.exitAdminMode=function(){
  try{logOp('Выход из админ-режима');}catch(e){}
  flush().then(function(){return api('/api/admin/logout',{});}).catch(function(){});
  sessionStorage.removeItem(AK);ADMIN=null;persistAdminSess();closeModal();toast('Режим администратора выключен');navigate('/profile');
};
W.zyroBoot=async function(){
  state=seedState();ME0=JSON.stringify(state.me);W.loadState();
  try{
    var j=await api('/api/sync?rev=-1');
    if(j.empty){await api('/api/init',{sellers:state.sellers,listings:state.listings});j=await api('/api/sync?rev=-1');}
    if(tok()&&!j.acc)localStorage.removeItem(TK);
    if(adm()&&!j.admin)sessionStorage.removeItem(AK);
    state.authed=!!j.acc;state.accKey=j.acc?j.acc.key:null;
    if(j.acc){state.me=freshMe();state.me.name=j.acc.name;state.me.balance=0;state.deals=[];state.notifications=[];state.myListings=[];state.favorites=[];}
    rev=j.rev;apply(j);
  }catch(e){toast('Нет связи с сервером','error');}
  ready=true;adminRestore();onRoute();startFrozenTicker();
  setInterval(poll,3000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
  window.addEventListener('pagehide',function(){if(timer)push();});
};
})();

</script>
</body>
