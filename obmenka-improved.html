<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Обменка — маркетплейс цифровых товаров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1115;
  --surface:#171A21;
  --surface-2:#1E222B;
  --surface-3:#252A35;
  --border:#2A2F3A;
  --border-soft:#232733;
  --text:#EDEEF2;
  --text-dim:#9BA1AF;
  --text-faint:#5C6270;
  --accent:#6C5CE7;
  --accent-soft:#6C5CE71f;
  --accent-2:#00D4B5;
  --accent-2-soft:#00D4B51f;
  --danger:#FF5470;
  --danger-soft:#FF54701a;
  --warning:#FFB020;
  --warning-soft:#FFB0201a;
  --r-s:10px;
  --r-m:16px;
  --r-l:22px;
  --font-display:'Unbounded', system-ui, sans-serif;
  --font-body:'Manrope', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:#08090c;
  font-family:var(--font-body);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
#shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.5);
  overflow-x:hidden;
  padding-bottom:78px;
  padding-top:env(safe-area-inset-top,0px);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{display:none;}
* { scrollbar-width:none; }

.h1,.h2,.h3{font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;color:var(--text);margin:0;}
.h1{font-size:22px;}
.h2{font-size:17px;}
.h3{font-size:14px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap8{gap:8px;}
.gap12{gap:12px;}
.wrap{flex-wrap:wrap;}

/* ---- topbar ---- */
.topbar{
  position:sticky;top:0;z-index:30;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
  background:linear-gradient(180deg, var(--bg) 70%, transparent);
  display:flex;align-items:center;gap:10px;
}
.topbar.solid{background:var(--bg);border-bottom:1px solid var(--border-soft);}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;color:var(--text);
}
.icon-btn:active{background:var(--surface-3);}
.icon-btn.accent{background:var(--accent);border-color:var(--accent);}

/* ---- bottom nav ---- */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;
  width:100%;max-width:480px;
  background:rgba(23,26,33,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-soft);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  z-index:40;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);width:60px;padding:4px 0;position:relative;cursor:pointer;}
.nav-item span{font-size:10.5px;font-weight:600;}
.nav-item.active{color:var(--accent-2);}
.nav-item .dot{position:absolute;top:-2px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.nav-sell{
  width:52px;height:52px;border-radius:18px;
  background:linear-gradient(145deg,var(--accent),#8b7bff);
  display:flex;align-items:center;justify-content:center;
  margin-top:-26px;box-shadow:0 8px 20px -6px rgba(108,92,231,.7);
  color:#fff;
}

/* ---- inputs ---- */
.input, .textarea, .select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);border-radius:var(--r-m);padding:12px 14px;font-size:14.5px;
  outline:none;
}
.input::placeholder,.textarea::placeholder{color:var(--text-faint);}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);}
.textarea{resize:none;min-height:100px;line-height:1.5;}
.search-bar{position:relative;}
.search-bar .input{padding-left:42px;}
.search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);}

/* ---- buttons ---- */
.btn{
  border:none;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14.5px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8577f0);color:#fff;}
.btn-accent2{background:var(--accent-2);color:#04211c;}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #ff547040;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ---- cards / chips ---- */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-l);}
.chip{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:#c9c2ff;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;}
.badge-verified{background:var(--accent-2-soft);color:var(--accent-2);}
.badge-online{background:#2ee6a622;color:#4be8b3;}
.badge-new{background:var(--warning-soft);color:var(--warning);}
.badge-promo{background:linear-gradient(135deg,#ffb020,#ff8a3d);color:#2a1500;}
.review-card{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:8px;}
.stat-bar-wrap{display:flex;align-items:flex-end;gap:6px;height:64px;}
.stat-bar{flex:1;background:linear-gradient(180deg,var(--accent-2),#00a68f);border-radius:6px 6px 2px 2px;min-height:4px;}
.countdown{font-variant-numeric:tabular-nums;font-weight:800;}
.progress-track{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.ref-code{font-family:monospace;font-size:15px;font-weight:700;letter-spacing:1px;background:var(--surface-3);border-radius:10px;padding:9px 12px;flex:1;}
.avatar{border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);color:#fff;flex-shrink:0;position:relative;}
.online-dot{position:absolute;bottom:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#33e39a;border:2px solid var(--bg);}

/* ---- listing card ---- */
.listing{display:flex;gap:12px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--border-soft);cursor:pointer;}
.listing:active{background:var(--surface-2);}
.listing-thumb{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff;font-size:18px;}

/* ---- category tile ---- */
.cat-tile{
  border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;
  height:86px;position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--border-soft);
}
.cat-tile:active{filter:brightness(1.1);}

/* ---- banners (deal states) ---- */
.deal-banner{display:flex;gap:10px;padding:12px 14px;align-items:flex-start;border-bottom:1px solid var(--border-soft);}
.deal-banner.b-active{background:var(--accent-2-soft);}
.deal-banner.b-paid{background:var(--warning-soft);}
.deal-banner.b-frozen{background:var(--danger-soft);}
.deal-banner.b-completed{background:#2a2f3a;}
.deal-banner.b-cancelled{background:#2a2f3a;}

/* ---- chat ---- */
.msg-row{display:flex;margin-bottom:10px;}
.msg-row.out{justify-content:flex-end;}
.bubble{max-width:76%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;}
.msg-row.in .bubble{background:var(--surface-2);border-bottom-left-radius:4px;}
.msg-row.out .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.msg-row.sys{justify-content:center;}
.msg-row.sys .bubble{background:transparent;color:var(--text-faint);font-size:12px;text-align:center;max-width:90%;}
.chat-input-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--surface);border-top:1px solid var(--border-soft);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;align-items:center;z-index:35;
}

/* ---- misc ---- */
.divider{height:1px;background:var(--border-soft);border:none;margin:0;}
.section-title{font-family:var(--font-display);font-size:15px;font-weight:700;margin:0 0 12px;}
.scroll-x{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
.scroll-x::-webkit-scrollbar{display:none;}
.star{color:#FFB020;}
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:12px;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fade-in{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 24px;color:var(--text-dim);gap:10px;}

/* ---- toast ---- */
#toast-root{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:448px;}
.toast{
  background:#1c2028;border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);
  animation:toastIn .2s ease;
}
.toast.success{border-color:#00d4b555;}
.toast.error{border-color:#ff547055;}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ---- modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(5,6,9,.65);z-index:90;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{
  width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:sheetUp .22s ease;max-height:80vh;overflow-y:auto;
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 14px;}

/* ---- image upload preview ---- */
.upload-tile{width:74px;height:74px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:var(--text-faint);}
.img-preview{width:74px;height:74px;border-radius:14px;object-fit:cover;flex-shrink:0;position:relative;}
.img-preview-wrap{position:relative;}
.img-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:2px solid var(--bg);}

.page{padding:0 16px 24px;}
</style>
</head>
<body>
<div id="shell">
  <div id="app"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   ОБМЕНКА — демо P2P маркетплейс (frontend-only, без бэкенда)
   ============================================================ */

/* ---------- icons ---------- */
function icon(name, size, color){
  size = size || 20; color = color || 'currentColor';
  const P = {
    home:'<path d="M4 11.5 12 5l8 6.5" /><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-8.5"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
    tag:'<path d="M3 11.5V5a1 1 0 0 1 1-1h6.5L20 12.5l-8.5 8.5L3 12.5z"/><circle cx="7.3" cy="7.3" r="1.3"/>',
    chat:'<path d="M4 5h16v11H8l-4 4z"/>',
    user:'<circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>',
    search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/>',
    filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
    back:'<path d="M15 5 8 12l7 7"/>',
    close:'<path d="M6 6l12 12M18 6 6 18"/>',
    send:'<path d="m4 12 16-8-6 16-2.5-6.5L4 12z"/>',
    star:'<path d="M12 3.5 14.5 9l6 .7-4.4 4 1.2 5.8-5.3-3-5.3 3 1.2-5.8-4.4-4 6-.7z"/>',
    shield:'<path d="M12 3 5 6v5.5c0 4.6 3 8 7 9.5 4-1.5 7-4.9 7-9.5V6z"/><path d="m9 12 2 2 4-4"/>',
    lock:'<rect x="5.5" y="10.5" width="13" height="9" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
    image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5-5 3 3 4-5 3 4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    check:'<path d="m5 13 4 4 10-10"/>',
    chev:'<path d="m9 5 7 7-7 7"/>',
    clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
    trash:'<path d="M5 7h14M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m1.5 0-.7 12a2 2 0 0 1-2 1.9h-3.6a2 2 0 0 1-2-1.9L7.5 7"/>',
    edit:'<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
    logout:'<path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M9 12h11m0 0-3-3m3 3-3 3"/>',
    wallet:'<rect x="3.5" y="6.5" width="17" height="12" rx="2.5"/><path d="M16 12.5h2.5"/><path d="M3.5 9.5h17"/>',
    bolt:'<path d="M13 3 5 13.5h5.5L11 21l8-10.5h-5.5z"/>',
    support:'<circle cx="12" cy="12" r="8.5"/><path d="M9.2 9.5a2.8 2.8 0 0 1 5.5.8c0 2-2.3 1.8-2.3 3.7" /><circle cx="12" cy="17" r=".4" fill="currentColor"/>',
    eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.7"/>',
    copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[name]||''}</svg>`;
}

/* ---------- storage ---------- */
const STORAGE_KEY = 'obmenka_state_v2';
let state = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = JSON.parse(raw); migrateState(); return; }
  }catch(e){}
  state = seedState();
  saveState();
}
function migrateState(){
  // добираем новые поля для данных, сохранённых предыдущей версией приложения
  if(state.authed === undefined) state.authed = false;
  if(!state.me) return;
  const me = state.me;
  if(me.verified === undefined) me.verified = false;
  if(me.avgResponseMin === undefined) me.avgResponseMin = 8;
  if(!Array.isArray(me.reviews)) me.reviews = [];
  if(!me.referralCode) me.referralCode = genRefCode();
  if(me.referralInvited === undefined) me.referralInvited = rnd(2,9);
  if(me.referralEarnings === undefined) me.referralEarnings = rnd(150,1800);
  (state.sellers||[]).forEach(s=>{
    if(s.avgResponseMin === undefined) s.avgResponseMin = rnd(1,45);
    if(!Array.isArray(s.reviews)) s.reviews = genReviews();
  });
  (state.listings||[]).forEach(l=>{
    if(l.promoted === undefined) l.promoted = false;
    if(l.promotedUntil === undefined) l.promotedUntil = 0;
    if(l.autoDelivery === undefined) l.autoDelivery = (l.category==='Ключи'||l.category==='Валюта');
  });
  (state.deals||[]).forEach(d=>{
    if(d.autoConfirmAt === undefined) d.autoConfirmAt = d.status==='paid' ? Date.now()+AUTO_CONFIRM_MS : 0;
    if(d.reviewed === undefined) d.reviewed = false;
    if(!d.listingId){
      const match = (state.listings||[]).find(l=>l.title===d.listingTitle);
      d.listingId = match ? match.id : null;
    }
  });
  if(!Array.isArray(state.statsHistory) || state.statsHistory.length===0){
    state.statsHistory = Array.from({length:7}, ()=>rnd(200,3200));
  }
  saveState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ---------- seed data ---------- */
const GAMES = [
  {id:'cs2', name:'CS2', color:'#e0a840', sub:'аккаунты, скины'},
  {id:'dota2', name:'Dota 2', color:'#b23a48', sub:'аккаунты, предметы'},
  {id:'valorant', name:'Valorant', color:'#ff4d5e', sub:'аккаунты'},
  {id:'genshin', name:'Genshin Impact', color:'#5b8def', sub:'аккаунты, донат'},
  {id:'fortnite', name:'Fortnite', color:'#8e5cff', sub:'скины, аккаунты'},
  {id:'steam', name:'Steam', color:'#4b6a8f', sub:'пополнение, ключи'},
  {id:'telegram', name:'Telegram', color:'#29a9ea', sub:'премиум, звёзды'},
  {id:'roblox', name:'Roblox', color:'#00a2ff', sub:'robux, аккаунты'},
  {id:'minecraft', name:'Minecraft', color:'#5b8731', sub:'аккаунты, донат'},
  {id:'wow', name:'World of Warcraft', color:'#c9a53b', sub:'золото, буст'},
  {id:'pubg', name:'PUBG Mobile', color:'#d68a2a', sub:'UC, аккаунты'},
  {id:'discord', name:'Discord', color:'#7289da', sub:'nitro, серверы'}
];
const CATEGORIES = ['Все','Аккаунты','Предметы','Валюта','Услуги','Ключи'];

function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function colorFromString(str){
  let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
  const palette = ['#6C5CE7','#00B39A','#FF6B81','#3D8BFD','#E0A840','#8E5CFF','#22C1A0','#EF6C6C'];
  return palette[Math.abs(h) % palette.length];
}
function fmtPrice(n){ return (n||0).toLocaleString('ru-RU') + ' ₽'; }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'только что';
  if(s<3600) return Math.floor(s/60)+' мин назад';
  if(s<86400) return Math.floor(s/3600)+' ч назад';
  return Math.floor(s/86400)+' дн назад';
}

const SELLER_NAMES = ['Артём К.','MaxTrade','GoodDeals','Ирина П.','SkinKing','FastSeller','Николай В.','ProGamer','TrustShop','Оксана Л.','ByteMarket','Тимур Р.'];

/* ---------- commission rates ---------- */
const SELL_FEE_RATE = 0.10;   // комиссия площадки при продаже товара — 10%
const TOPUP_FEE_RATE = 0.05;  // комиссия площадки при пополнении баланса — 5%
const PROMO_PRICE = 149;      // стоимость продвижения объявления на 7 дней

/* ---------- toast ---------- */
function toast(msg, type){
  type = type || 'default';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type==='success' ? icon('check',16,'#00D4B5') : type==='error' ? icon('close',16,'#FF5470') : icon('bolt',16,'#9BA1AF');
  el.innerHTML = ic + '<span>'+msg+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 2400);
}

const NAV_TABS = [
  {path:'/', label:'Главная', icon:'home'},
  {path:'/catalog', label:'Каталог', icon:'grid'},
  {path:'/sell', label:'Продать', icon:'plus', isFab:true},

  {path:'/profile', label:'Профиль', icon:'user'}
];

function currentHash(){
  const h = location.hash.replace(/^#/,'') || '/';
  const [path, query] = h.split('?');
  const params = {};
  if(query) query.split('&').forEach(p=>{ const [k,v]=p.split('='); if(k) params[k]=decodeURIComponent(v||''); });
  return {path: path || '/', params};
}
function navigate(hash){ location.hash = hash; }
function goBack(){ history.back(); }

let catalogFilters = { q:'', game:'', cat:'Все', sort:'new', verifiedOnly:false, priceMin:'', priceMax:'', minRating:0 };

function renderNav(){
  const {path} = currentHash();
  const topPath = '/' + (path.split('/')[1]||'');
  const unread = state.deals.reduce((a,d)=>a+(d.unread||0),0);
  document.getElementById('bottomNav').innerHTML = NAV_TABS.map(t=>{
    const active = topPath === t.path || (t.path==='/' && topPath==='/');
    if(t.isFab){
      return `<a class="nav-item" href="#${t.path}"><div class="nav-sell">${icon('plus',24,'#fff')}</div></a>`;
    }
    return `<a class="nav-item ${active?'active':''}" href="#${t.path}">
        ${icon(t.icon,21)}
        <span>${t.label}</span>
        ${t.path==='/chats' && unread>0 ? `<div class="dot"></div>` : ''}
      </a>`;
  }).join('');
}

function onRoute(){
  const {path, params} = currentHash();
  const app = document.getElementById('app');
  let html = '';
  const AUTH_REQUIRED_PATHS = ['/sell','/profile','/profile/listings','/profile/edit'];
  const needsAuth = AUTH_REQUIRED_PATHS.includes(path);
  if(needsAuth && !state.authed){
    html = pageAuthGate(path);
  }
  else if(path === '/' ) html = pageHome();
  else if(path === '/catalog') html = pageCatalog(params);
  else if(path.startsWith('/item/')) html = pageItem(path.split('/')[2]);
  else if(path === '/sell') html = pageSell();
  else if(path === '/chats') html = pageChats();
  else if(path.startsWith('/chat/')) html = pageChat(path.split('/')[2]);
  else if(path === '/profile') html = pageProfile();
  else if(path === '/profile/listings') html = pageMyListings();
  else if(path === '/profile/edit') html = pageEditProfile();
  else if(path === '/admin') html = pageAdmin();
  else html = page404();

  app.innerHTML = `<div class="fade-in">${html}</div>`;
  window.scrollTo(0,0);
  renderNav();
  afterRender(path, params);
}

function afterRender(path, params){
  if(path === '/chat/'){} // noop
  if(path === '/admin'){
    renderAdminList();
  }
  if(path === '/sell'){
    updateSellPriceCalc();
  }
  if(path.startsWith('/chat/')){
    const box = document.getElementById('msgScroll');
    if(box) box.scrollTop = box.scrollHeight;
    const input = document.getElementById('chatInputField');
    if(input) input.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(path.split('/')[2]); }
    });
    startDealTimer(path.split('/')[2]);
  } else {
    stopDealTimer();
  }
  if(path === '/catalog'){
    renderCatalogList();
  }
}

/* ---------- auto-confirm escrow timer ---------- */
let dealTimerInterval = null;
function stopDealTimer(){
  if(dealTimerInterval){ clearInterval(dealTimerInterval); dealTimerInterval = null; }
}
function startDealTimer(dealId){
  stopDealTimer();
  const tick = ()=>{
    const d = state.deals.find(x=>x.id===dealId);
    const el = document.getElementById('autoConfirmCountdown');
    if(!d || d.status!=='paid' || !d.autoConfirmAt || !el){ stopDealTimer(); return; }
    const left = d.autoConfirmAt - Date.now();
    if(left <= 0){
      stopDealTimer();
      completeDeal(dealId, true);
      return;
    }
    const mm = String(Math.floor(left/60000)).padStart(2,'0');
    const ss = String(Math.floor((left%60000)/1000)).padStart(2,'0');
    el.textContent = mm+':'+ss;
  };
  tick();
  dealTimerInterval = setInterval(tick, 1000);
}

function renderCatalogList(){
  const listEl = document.getElementById('catalog-list');
  if(!listEl) return;
  let items = state.listings.filter(l=>{
    const seller = state.sellers.find(s=>s.id===l.sellerId);
    if(catalogFilters.game && l.gameId !== catalogFilters.game) return false;
    if(catalogFilters.cat && catalogFilters.cat !== 'Все' && l.category !== catalogFilters.cat) return false;
    if(catalogFilters.verifiedOnly && !(seller && seller.verified)) return false;
    if(catalogFilters.priceMin !== '' && l.price < +catalogFilters.priceMin) return false;
    if(catalogFilters.priceMax !== '' && l.price > +catalogFilters.priceMax) return false;
    if(catalogFilters.minRating && !(seller && +seller.rating >= catalogFilters.minRating)) return false;
    if(catalogFilters.q){
      const q = catalogFilters.q.toLowerCase();
      if(!l.title.toLowerCase().includes(q) && !(seller && seller.name.toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if(catalogFilters.sort==='new') items.sort((a,b)=>b.createdAt-a.createdAt);
  if(catalogFilters.sort==='price_asc') items.sort((a,b)=>a.price-b.price);
  if(catalogFilters.sort==='price_desc') items.sort((a,b)=>b.price-a.price);
  if(catalogFilters.sort==='rating'){
    items.sort((a,b)=>{
      const ra = state.sellers.find(s=>s.id===a.sellerId).rating;
      const rb = state.sellers.find(s=>s.id===b.sellerId).rating;
      return rb-ra;
    });
  }
  // продвинутые объявления всегда поднимаются в начало выдачи (платное продвижение)
  items.sort((a,b)=>{
    const pa = a.promoted && a.promotedUntil > Date.now() ? 1 : 0;
    const pb = b.promoted && b.promotedUntil > Date.now() ? 1 : 0;
    return pb - pa;
  });

  const countEl = document.getElementById('catalogCount');
  if(countEl) countEl.textContent = items.length + ' объявлени' + (items.length%10===1 && items.length%100!==11 ? 'е' : (items.length%10>=2 && items.length%10<=4 && !(items.length%100>=12&&items.length%100<=14) ? 'я' : 'й'));

  if(items.length===0){
    listEl.innerHTML = `<div class="empty-state">${icon('search',36,'var(--text-faint)')}<div class="h2">Ничего не нашлось</div><div class="muted" style="font-size:13px;">Попробуйте изменить фильтры или запрос</div></div>`;
    return;
  }
  listEl.innerHTML = items.map(listingCardHtml).join('');
}

function toggleFavorite(id){
  const i = state.favorites.indexOf(id);
  if(i>=0){ state.favorites.splice(i,1); toast('Убрано из избранного'); }
  else { state.favorites.push(id); toast('Добавлено в избранное','success'); }
  saveState();
  onRoute();
}

function openChatWithSeller(listingId, justChat){
  const l = state.listings.find(x=>x.id===listingId);
  const seller = state.sellers.find(s=>s.id===l.sellerId);
  let deal = state.deals.find(d=>d.listingTitle===l.title && d.counterparty.id===seller.id);
  if(!deal){
    const messages = justChat ? [
      {from:'sys', text:'Начните диалог с продавцом. Средства будут заморожены гарантом только после оформления сделки.', ts: Date.now()}
    ] : [
      {from:'sys', text:'Сделка создана. Оплата '+fmtPrice(l.price)+' заморожена гарантом до подтверждения получения товара покупателем.', ts: Date.now()}
    ];
    if(!justChat && l.autoDelivery){
      const code = genDeliveryCode();
      messages.push({from:'sys', text:'Товар выдан автоматически системой (без участия продавца): <span class="ref-code" style="display:inline-block;margin-top:6px;cursor:pointer;" onclick="copyDeliveryCode(this)">'+code+' 📋</span>', ts: Date.now()+1});
    }
    deal = {
      id: uid('deal'),
      listingId: l.id,
      listingTitle: l.title,
      price: l.price,
      counterparty: seller,
      status: justChat ? 'active' : 'paid',
      unread:0,
      updatedAt: Date.now(),
      autoConfirmAt: justChat ? 0 : Date.now()+AUTO_CONFIRM_MS,
      reviewed:false,
      messages
    };
    state.deals.unshift(deal);
    saveState();
  }
  navigate('/chat/'+deal.id);
}

function genDeliveryCode(){
  return Array.from({length:4},()=>Math.random().toString(36).slice(2,6).toUpperCase()).join('-');
}
function copyDeliveryCode(el){
  const code = (el.textContent||'').replace('📋','').trim();
  if(navigator.clipboard && code) navigator.clipboard.writeText(code).catch(()=>{});
  toast('Код скопирован','success');
}

function updateSellPriceCalc(){
  const el = document.getElementById('sellPrice');
  const out = document.getElementById('sellNetPrice');
  if(!el || !out) return;
  const price = parseFloat(el.value) || 0;
  const fee = Math.round(price * SELL_FEE_RATE);
  const net = price - fee;
  out.textContent = (price>0 ? net.toLocaleString('ru-RU') : '0') + ' ₽';
}

function selectSellCat(el){
  document.querySelectorAll('#sellCatChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sellCategory').value = el.dataset.cat;
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(sellDraft.images.length>=5) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    sellDraft.images.push(reader.result);
    onRoute();
  };
  reader.readAsDataURL(file);
}
function removeSellImage(i){
  sellDraft.images.splice(i,1);
  onRoute();
}

function submitSellForm(e){
  e.preventDefault();
  const gameId = document.getElementById('sellGame').value;
  const title = document.getElementById('sellTitle').value.trim();
  const desc = document.getElementById('sellDesc').value.trim();
  const price = parseInt(document.getElementById('sellPrice').value, 10);
  const category = document.getElementById('sellCategory').value;
  if(!gameId || !title || !desc || !price || price<=0){
    toast('Заполните все поля корректно','error');
    return false;
  }
  const game = GAMES.find(g=>g.id===gameId);
  const listing = {
    id: uid('lst'),
    gameId, category, title,
    description: desc,
    price,
    sellerId: 'me',
    views: 0,
    createdAt: Date.now(),
    color: game.color
  };
  state.listings.unshift(listing);
  state.myListings.unshift(listing.id);
  if(!state.sellers.find(s=>s.id==='me')){
    state.sellers.push(Object.assign({}, state.me, {id:'me'}));
  }
  sellDraft = {images:[]};
  const fee = Math.round(price * SELL_FEE_RATE);
  saveState();
  toast('Опубликовано. Комиссия при продаже: '+fee.toLocaleString('ru-RU')+' ₽ ('+Math.round(SELL_FEE_RATE*100)+'%)','success');
  navigate('/profile/listings');
  return false;
}

    </div>`;
  }
  if(d.status==='frozen'){
    return `<div style="position:fixed;bottom:62px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border-soft);padding:10px 12px;display:flex;gap:8px;z-index:34;">

function createDealFromChat(id){
  const d = state.deals.find(x=>x.id===id);
  d.status = 'paid';
  d.updatedAt = Date.now();
  d.autoConfirmAt = Date.now()+AUTO_CONFIRM_MS;
  d.messages.push({from:'sys', text:'Сделка оформлена. '+fmtPrice(d.price)+' заморожены гарантом до подтверждения получения товара.', ts:Date.now()});
  const l = state.listings.find(x=>x.id===d.listingId);
  if(l && l.autoDelivery){
    const code = genDeliveryCode();
    d.messages.push({from:'sys', text:'Товар выдан автоматически системой (без участия продавца): <span class="ref-code" style="display:inline-block;margin-top:6px;cursor:pointer;" onclick="copyDeliveryCode(this)">'+code+' 📋</span>', ts:Date.now()+1});
  }
  saveState();
  toast('Сделка оформлена','success');
  onRoute();
}

function completeDeal(id, auto){
  const d = state.deals.find(x=>x.id===id);
  if(!d || d.status!=='paid') return;
  d.status = 'completed';
  d.updatedAt = Date.now();
  d.messages.push({from:'sys', text: auto
    ? 'Время на открытие спора истекло. Сделка автоматически подтверждена, средства переведены продавцу.'
    : 'Покупатель подтвердил получение товара. Средства переведены продавцу. Сделка завершена.', ts:Date.now()});
  saveState();
  toast('Сделка завершена','success');
  onRoute();
  if(!d.reviewed) setTimeout(()=>openModal(reviewSheet(id)), 400);
}

function reviewSheet(dealId){
  return `<div class="h2" style="margin-bottom:4px;">Оцените продавца</div>
  <div class="faint" style="font-size:12px;margin-bottom:14px;">Отзыв увидят другие покупатели на странице продавца</div>
  <div class="row gap8" id="reviewStars" style="margin-bottom:14px;justify-content:center;">
    ${[1,2,3,4,5].map(n=>`<span onclick="setReviewStar(${n})" data-star="${n}" style="cursor:pointer;">${icon('star',26, n<=reviewStarValue ? '#FFB020' : 'var(--border)')}</span>`).join('')}
  </div>
  <textarea class="textarea" id="reviewText" placeholder="Как прошла сделка?"></textarea>
  <div class="row gap8" style="margin-top:14px;">
    <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Позже</button>
    <button class="btn btn-primary" style="flex:1.4;" onclick="submitReview('${dealId}')">Отправить отзыв</button>
  </div>`;
}
let reviewStarValue = 5;
function setReviewStar(n){
  reviewStarValue = n;
  document.querySelectorAll('#reviewStars span').forEach(s=>{
    const filled = +s.dataset.star <= n;
    s.innerHTML = icon('star',26, filled ? '#FFB020' : 'var(--border)');
  });
}
function submitReview(dealId){
  const d = state.deals.find(x=>x.id===dealId);
  if(!d) return;
  const text = (document.getElementById('reviewText')||{}).value?.trim() || '';
  const seller = state.sellers.find(s=>s.id===d.counterparty.id);
  if(seller){
    seller.reviews = seller.reviews || [];
    seller.reviews.unshift({author: state.me.name, rating: reviewStarValue, text: text || 'Сделка прошла успешно.', ts: Date.now()});
    const ratings = seller.reviews.map(r=>r.rating);
    seller.rating = (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1);
  }
  d.reviewed = true;
  reviewStarValue = 5;
  saveState();
  closeModal();
  toast('Спасибо за отзыв!','success');
  onRoute();
}

function freezeDeal(id){
  const d = state.deals.find(x=>x.id===id);
  d.status = 'frozen';
  d.updatedAt = Date.now();
  d.messages.push({from:'sys', text:'Открыт спор. Сделка заморожена, переписка ограничена. Подключена поддержка платформы — среднее время ответа 24 часа.', ts:Date.now()});
  saveState();
  closeModal();
  toast('Сделка заморожена','error');
  onRoute();
}

function unfreezeDeal(id){
  const d = state.deals.find(x=>x.id===id);
  d.status = 'paid';
  d.updatedAt = Date.now();
  d.messages.push({from:'sys', text:'Поддержка разобралась в ситуации. Сделка разморожена, диалог снова доступен.', ts:Date.now()});
  saveState();
  toast('Сделка разморожена','success');
  onRoute();
}

function cancelDeal(id){
  const d = state.deals.find(x=>x.id===id);
  d.status = 'cancelled';
  d.updatedAt = Date.now();
  d.messages.push({from:'sys', text:'Спор решён в пользу покупателя. Средства возвращены. Сделка отменена.', ts:Date.now()});
  saveState();
  toast('Сделка отменена');
  onRoute();
}

function sendMessage(id){
  const input = document.getElementById('chatInputField');
  if(!input) return;
  const text = input.value.trim();
  if(!text) return;
  const d = state.deals.find(x=>x.id===id);
  if(!d || d.status==='frozen' || d.status==='completed' || d.status==='cancelled') return; // hard guard against sending while frozen/closed
  d.messages.push({from:'me', text, ts:Date.now()});
  d.updatedAt = Date.now();
  input.value = '';
  saveState();
  onRoute();
  // simulate a quick reply for demo liveliness, unless deal got frozen already
  setTimeout(()=>{
    const dd = state.deals.find(x=>x.id===id);
    if(!dd || dd.status==='frozen' || dd.status==='completed' || dd.status==='cancelled') return;
    dd.messages.push({from:'them', text: pick(['Понял, секунду.','Хорошо, сейчас проверю.','Договорились!','Спасибо за информацию.']), ts:Date.now()});
    dd.updatedAt = Date.now();
    saveState();
    if(currentHash().path === '/chat/'+id) onRoute();
  }, 1100 + Math.random()*900);
}

function sellerStatsCard(){

  const totalViews = mine.reduce((a,l)=>a+l.views,0);
  const completedSales = state.deals.filter(d=>d.status==='completed').length;
  const conversion = totalViews>0 ? ((completedSales/totalViews)*100).toFixed(1) : '0.0';
  const hist = state.statsHistory || [];
  const max = Math.max(...hist, 1);
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  return `<div class="card" style="padding:14px;margin-bottom:16px;">
    <div class="row between" style="margin-bottom:12px;">

        <div class="h2" style="font-size:16px;">${completedSales}</div>
        <div class="faint" style="font-size:10.5px;">продаж</div>
      </div>

function updateTopupCalc(){
  const el = document.getElementById('topupAmount');
  const amt = parseFloat(el.value) || 0;
  const fee = Math.round(amt * TOPUP_FEE_RATE);
  const net = amt - fee;
  document.getElementById('topupFee').textContent = (amt>0?fee.toLocaleString('ru-RU'):'0') + ' ₽';
  document.getElementById('topupNet').textContent = (amt>0?net.toLocaleString('ru-RU'):'0') + ' ₽';
}

function confirmTopUp(){
  const el = document.getElementById('topupAmount');
  const amt = parseFloat(el.value) || 0;
  if(amt <= 0){ toast('Введите сумму пополнения','error'); return; }
  const fee = Math.round(amt * TOPUP_FEE_RATE);
  const net = amt - fee;
  state.me.balance += net;
  saveState();
  closeModal();
  toast('Зачислено '+net.toLocaleString('ru-RU')+' ₽ (комиссия '+fee.toLocaleString('ru-RU')+' ₽)','success');
  onRoute();
}

      <a href="#/sell"><button class="btn btn-primary" style="margin-top:10px;">${icon('plus',16,'#fff')} Создать объявление</button></a>
      </div>
    ` : `<div style="display:flex;flex-direction:column;gap:10px;">
      ${mine.map(l=>{
        const isPromoted = l.promoted && l.promotedUntil > Date.now();
        return `
        <div class="listing" style="flex-direction:column;align-items:stretch;">
          <div class="row gap12">
            <div class="listing-thumb" style="background:linear-gradient(145deg, ${l.color}, ${l.color}99);">${(GAMES.find(g=>g.id===l.gameId)||{}).name?.[0]||'?'}</div>
            <div style="flex:1;min-width:0;" onclick="navigate('/item/${l.id}')">
              <div class="row between" style="align-items:flex-start;">
                <div class="h3" style="font-size:13.5px;max-width:76%;">${l.title}</div>
                ${isPromoted ? `<span class="badge badge-promo">${icon('bolt',10)} ТОП</span>` : ''}
              </div>
              <div class="faint" style="font-size:11.5px;margin-top:4px;">${l.views} просмотров · ${timeAgo(l.createdAt)}</div>
              <div class="h2" style="font-size:15px;color:var(--accent-2);margin-top:6px;">${fmtPrice(l.price)}</div>
            </div>
            <div class="icon-btn" onclick="deleteMyListing('${l.id}')">${icon('trash',15,'var(--danger)')}</div>
          </div>
          <div class="row gap8" style="margin-top:10px;">
            ${isPromoted
              ? `<div class="faint" style="font-size:11.5px;flex:1;">${icon('bolt',12,'var(--warning)')} В топе до ${new Date(l.promotedUntil).toLocaleDateString('ru-RU')}</div>`
              : `<button class="btn btn-sm btn-accent2" style="flex:1;" onclick="openModal(promoteSheet('${l.id}'))">${icon('bolt',13)} Продвинуть за ${PROMO_PRICE} ₽</button>`}
          </div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}

function promoteSheet(listingId){
  return `<div class="h2" style="margin-bottom:6px;">Продвижение объявления</div>
  <div class="muted" style="font-size:13px;margin-bottom:16px;line-height:1.5;">
    Объявление поднимется в начало выдачи каталога и получит отметку «ТОП» на ${PROMO_DAYS} дней. По статистике продвинутые объявления получают заметно больше просмотров.
  </div>
  <div class="row between" style="padding:10px 2px;">
    <span style="font-size:13.5px;">Стоимость</span>
    <span class="h2" style="font-size:16px;color:var(--warning);">${PROMO_PRICE} ₽</span>
  </div>
  <div class="row between" style="padding:10px 2px;margin-bottom:16px;">
    <span class="faint" style="font-size:12px;">Ваш баланс</span>
    <span class="faint" style="font-size:12px;">${fmtPrice(state.me.balance)}</span>
  </div>
  <div class="row gap8">
    <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Отмена</button>
    <button class="btn btn-accent2" style="flex:1.3;" onclick="confirmPromote('${listingId}')">${icon('bolt',15)} Оплатить и продвинуть</button>
  </div>`;
}

function confirmPromote(listingId){
  if(state.me.balance < PROMO_PRICE){ toast('Недостаточно средств на балансе','error'); return; }
  const l = state.listings.find(x=>x.id===listingId);
  if(!l) return;
  state.me.balance -= PROMO_PRICE;
  l.promoted = true;
  l.promotedUntil = Date.now() + PROMO_DAYS*86400000;
  saveState();
  closeModal();
  toast('Объявление продвинуто на '+PROMO_DAYS+' дней','success');
  onRoute();
}

function deleteMyListing(id){
  state.myListings = state.myListings.filter(x=>x!==id);
  state.listings = state.listings.filter(x=>x.id!==id);
  saveState();
  toast('Объявление удалено');
  onRoute();
}

function pageEditProfile(){
  const me = state.me;
  return `${topbar({title:'Редактировать профиль', back:true})}
  <form class="page" onsubmit="return saveProfile(event)">
    <div class="row" style="justify-content:center;margin-bottom:20px;">
      <div class="avatar" style="width:76px;height:76px;background:${me.color};font-size:24px;">${initials(me.name)}</div>
    </div>
    <div class="section-title">Имя</div>
    <input class="input" id="editName" value="${me.name}" style="margin-bottom:16px;" required>
    <div class="section-title">О себе</div>
    <textarea class="textarea" id="editBio" placeholder="Расскажите немного о себе...">Продаю игровые аккаунты и валюту, работаю с 2022 года.</textarea>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" type="submit">Сохранить</button>
  </form>`;
}
function saveProfile(e){
  e.preventDefault();
  state.me.name = document.getElementById('editName').value.trim() || state.me.name;
  saveState();
  toast('Профиль обновлён','success');
  navigate('/profile');
  return false;
}

/* ============================================================
   ADMIN PANEL (модерация: заморозка / бан по ID или IP)
   ============================================================ */
let adminQuery = '';

function allUsers(){
  // все пользователи площадки: продавцы + текущий пользователь
  const list = [...state.sellers];
  if(!list.find(u=>u.id==='me')) list.push(state.me);
  return list;
}

function pageAdmin(){
  const users = allUsers();
  const bannedCount = users.filter(u=>u.status==='banned').length;
  const frozenCount = users.filter(u=>u.status==='frozen').length;
  return `
  ${topbar({title:'Админ-панель', back:true, solid:true})}
  <div class="page">
    <div class="row gap8" style="margin-bottom:16px;">
      <div class="card" style="flex:1;padding:12px;text-align:center;">
        <div class="h1" style="font-size:17px;">${users.length}</div>
        <div class="faint" style="font-size:10.5px;margin-top:2px;">Пользователей</div>
      </div>
      <div class="card" style="flex:1;padding:12px;text-align:center;">
        <div class="h1" style="font-size:17px;color:var(--warning);">${frozenCount}</div>
        <div class="faint" style="font-size:10.5px;margin-top:2px;">Ограничено</div>
      </div>
      <div class="card" style="flex:1;padding:12px;text-align:center;">
        <div class="h1" style="font-size:17px;color:var(--danger);">${bannedCount}</div>
        <div class="faint" style="font-size:10.5px;margin-top:2px;">Забанено</div>
      </div>
    </div>

    <div class="search-bar" style="margin-bottom:16px;">
      ${icon('search',18,'var(--text-faint)')}
      <input class="input" placeholder="Поиск по ID или IP игрока..." value="${adminQuery}" oninput="adminQuery=this.value; renderAdminList();">
    </div>

    <div id="admin-list" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>`;
}

function renderAdminList(){
  const listEl = document.getElementById('admin-list');
  if(!listEl) return;
  const q = adminQuery.trim().toLowerCase();
  let users = allUsers();
  if(q){
    users = users.filter(u =>
      u.id.toLowerCase().includes(q) ||
      (u.ip||'').toLowerCase().includes(q) ||
      u.name.toLowerCase().includes(q)
    );
  }
  if(users.length===0){
    listEl.innerHTML = `<div class="empty-state">${icon('search',34,'var(--text-faint)')}<div class="h2">Никого не нашли</div><div class="muted" style="font-size:13px;">Проверьте ID или IP и попробуйте снова</div></div>`;
    return;
  }
  listEl.innerHTML = users.map(adminUserRowHtml).join('');
}

function adminUserRowHtml(u){
  const statusMap = {
    active:{label:'Активен', color:'var(--accent-2)'},
    frozen:{label:'Заморожен', color:'var(--warning)'},
    banned:{label:'Забанен', color:'var(--danger)'}
  };
  const st = statusMap[u.status] || statusMap.active;
  return `<div class="card" style="padding:12px;">
    <div class="row gap12" style="margin-bottom:10px;">
      <div class="avatar" style="width:44px;height:44px;background:${u.color};font-size:15px;">${initials(u.name)}</div>
      <div style="flex:1;min-width:0;">
        <div class="row between">
          <span class="h3" style="font-size:13.5px;">${u.name}</span>
          <span class="badge" style="background:${st.color}22;color:${st.color};">${st.label}</span>
        </div>
        <div class="faint" style="font-size:11px;margin-top:3px;font-family:monospace;">ID: ${u.id} · IP: ${u.ip||'—'}</div>
      </div>
    </div>
    <div class="row gap8">
      <button class="btn btn-sm ${u.status==='frozen'?'btn-accent2':'btn-ghost'}" style="flex:1;" onclick="toggleUserStatus('${u.id}','frozen')">
        ${icon('lock',13)} ${u.status==='frozen' ? 'Разморозить' : 'Заморозить'}
      </button>
      <button class="btn btn-sm ${u.status==='banned'?'btn-ghost':'btn-danger'}" style="flex:1;" onclick="toggleUserStatus('${u.id}','banned')">
        ${icon('close',13)} ${u.status==='banned' ? 'Разбанить' : 'Забанить'}
      </button>
    </div>
  </div>`;
}

function toggleUserStatus(userId, kind){
  const u = allUsers().find(x=>x.id===userId);
  if(!u) return;

  if(kind==='frozen'){
    u.status = (u.status==='frozen') ? 'active' : 'frozen';
    toast(u.status==='frozen' ? 'Пользователь заморожен' : 'Пользователь разморожен', u.status==='frozen' ? 'error' : 'success');
  }
  if(kind==='banned'){
    u.status = (u.status==='banned') ? 'active' : 'banned';
    toast(u.status==='banned' ? 'Пользователь забанен' : 'Пользователь разбанен', u.status==='banned' ? 'error' : 'success');
  }

  // если у пользователя есть активные сделки — при бане/заморозке замораживаем и их диалоги
  if(u.status==='banned' || u.status==='frozen'){
    state.deals.forEach(d=>{
      if(d.counterparty.id===userId && (d.status==='active' || d.status==='paid')){
        d.status = 'frozen';
        d.updatedAt = Date.now();
        d.messages.push({from:'sys', text:'Сделка заморожена автоматически: администрация ограничила аккаунт продавца.', ts:Date.now()});
      }
    });
  }

  saveState();
  renderAdminList();
}
</script>

<script>
  // ============================================================
  // Собственная авторизация по нику и паролю (без Google/Firebase)
  // ============================================================
  //
  // Как подключить настоящий бесплатный хостинг под базу аккаунтов:
  //  1. Разверните лёгкий бэкенд с двумя эндпоинтами (например, на
  //     бесплатном тарифе Cloudflare Workers + KV, Supabase, Render
  //     или любом другом хостинге с REST API):
  //       GET  /accounts/:nickname   -> {nickname, password} или 404
  //       POST /accounts             -> body {nickname, password}, создаёт запись
  //  2. Впишите адрес этого бэкенда в ACCOUNTS_API_URL ниже, например:
  //       const ACCOUNTS_API_URL = "https://my-backend.example.com/accounts";
  //  3. Всё остальное менять не нужно — код сам начнёт использовать
  //     удалённую базу вместо localStorage (см. ACCOUNTS_DB ниже).
  //     Если ACCOUNTS_API_URL пустой или бэкенд недоступен, логины
  //     автоматически хранятся в localStorage браузера (offline-режим).
  const ACCOUNTS_API_URL = ""; // <-- впишите сюда URL вашего бесплатного хостинга, когда он будет готов

  const ACCOUNTS_LOCAL_KEY = "obmenka_accounts_db";

  function toastOrAlert(msg, type){
    try{
      if(typeof toast === 'function'){ toast(msg, type||'default'); return; }
    }catch(e){}
    alert(msg);
  }

  function readLocalAccounts(){
    try{
      const raw = localStorage.getItem(ACCOUNTS_LOCAL_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function writeLocalAccounts(db){
    try{ localStorage.setItem(ACCOUNTS_LOCAL_KEY, JSON.stringify(db)); }catch(e){}
  }

  // Единая точка доступа к "базе логов" — сейчас localStorage,
  // но если задан ACCOUNTS_API_URL, сначала пробуем удалённый хостинг.
  const ACCOUNTS_DB = {
    async find(nickname){
      const key = (nickname || '').trim().toLowerCase();
      if(ACCOUNTS_API_URL){
        try{
          const res = await fetch(ACCOUNTS_API_URL.replace(/\/$/,'') + '/' + encodeURIComponent(key));
          if(res.status === 404) return null;
          if(res.ok) return await res.json();
        }catch(e){ /* бэкенд недоступен — уходим в offline-режим ниже */ }
      }
      const db = readLocalAccounts();
      return db[key] || null;
    },
    async save(nickname, password){
      const key = (nickname || '').trim().toLowerCase();
      if(ACCOUNTS_API_URL){
        try{
          const res = await fetch(ACCOUNTS_API_URL, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nickname: key, password })
          });
          if(res.ok) return true;
        }catch(e){ /* бэкенд недоступен — уходим в offline-режим ниже */ }
      }
      const db = readLocalAccounts();
      db[key] = { nickname: key, password };
      writeLocalAccounts(db);
      return true;
    }
  };

  function applyLocalUser(nickname){
    try{
      if((typeof state === 'undefined' || state === null) && typeof loadState === 'function'){
        loadState();
      }
      if(typeof state !== 'undefined' && state && state.me){
        state.me.name = nickname;
        state.authed = true;
        if(typeof saveState === 'function') saveState();
        if(typeof onRoute === 'function') onRoute();
      }
    }catch(e){}
  }

  function authModalContent(mode, error){
    mode = mode || 'login'; // 'login' | 'register'
    const isLogin = mode === 'login';
    return `
    <div style="padding:22px;max-width:320px;">
      <div class="h2" style="margin-bottom:4px;">${isLogin ? 'Вход' : 'Регистрация'}</div>
      <div class="muted" style="font-size:13px;margin-bottom:16px;">${isLogin ? 'Введите ник и пароль, указанные при регистрации.' : 'Придумайте ник и пароль — они понадобятся для входа с любого устройства.'}</div>
      ${error ? `<div style="color:var(--danger);font-size:13px;margin-bottom:12px;">${error}</div>` : ''}
      <input id="authNickInput" class="input" placeholder="Ник" style="margin-bottom:10px;width:100%;" autocomplete="username">
      <input id="authPassInput" type="password" class="input" placeholder="Пароль" style="margin-bottom:16px;width:100%;" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      <button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="${isLogin ? 'submitLocalLogin()' : 'submitLocalRegister()'}">
        ${isLogin ? 'Войти' : 'Зарегистрироваться'}
      </button>
      <button class="btn btn-ghost btn-block" onclick="openAuthModal('${isLogin ? 'register' : 'login'}')">
        ${isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти'}
      </button>
    </div>`;
  }

  window.openAuthModal = function(mode, error){
    if(typeof openModal === 'function'){
      openModal(authModalContent(mode, error));
    }
  };

  window.submitLocalRegister = async function(){
    const nickEl = document.getElementById('authNickInput');
    const passEl = document.getElementById('authPassInput');
    const nickname = nickEl ? nickEl.value.trim() : '';
    const password = passEl ? passEl.value : '';
    if(!nickname || !password){
      openAuthModal('register', 'Введите ник и пароль.');
      return;
    }
    if(password.length < 4){
      openAuthModal('register', 'Пароль должен быть не короче 4 символов.');
      return;
    }
    const existing = await ACCOUNTS_DB.find(nickname);
    if(existing){
      openAuthModal('register', 'Такой ник уже занят, придумайте другой.');
      return;
    }
    await ACCOUNTS_DB.save(nickname, password);
    applyLocalUser(nickname);
    if(typeof closeModal === 'function') closeModal();
    toastOrAlert('Вы зарегистрированы! Привет, ' + nickname, 'success');
  };

  window.submitLocalLogin = async function(){
    const nickEl = document.getElementById('authNickInput');
    const passEl = document.getElementById('authPassInput');
    const nickname = nickEl ? nickEl.value.trim() : '';
    const password = passEl ? passEl.value : '';
    if(!nickname || !password){
      openAuthModal('login', 'Введите ник и пароль.');
      return;
    }
    const account = await ACCOUNTS_DB.find(nickname);
    if(!account || account.password !== password){
      // "надпись что нужно авторизоваться" — такого аккаунта нет, предлагаем зарегистрироваться
      openAuthModal('register', 'Такого аккаунта нет. Придумайте ник и пароль, чтобы зарегистрироваться.');
      return;
    }
    applyLocalUser(nickname);
    if(typeof closeModal === 'function') closeModal();
    toastOrAlert('Успешный вход! Привет, ' + nickname, 'success');
  };

</script>
</body>
</html>
